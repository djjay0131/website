name: secrets-sync

# D19 (2026-10-08): every secret reaches Secret Manager through this workflow,
# never through a manual `gcloud` step. The pattern is written down in
# llm/governance/patterns/secrets-management.md and applies to future secrets
# (the family site included).
#
# WHAT THE OWNER DOES, and it is the only manual act:
#   1. Settings > Secrets and variables > Actions.
#        - Secret     NOTES_EXPORT_APP_KEY            (the App's .pem private key)
#        - Variable   NOTES_EXPORT_APP_ID             (the App id)
#        - Variable   NOTES_EXPORT_INSTALLATION_ID    (the installation id)
#   2. gh workflow run secrets-sync.yml
# GitHub offers no API to create an App or mint its key, so that paste cannot be
# automated; everything after it can and is.
#
# THIS WORKFLOW:
#   - enables secretmanager.googleapis.com if it is disabled;
#   - creates the Secret Manager secret `notes-export-app-key` in cusati-hub if
#     it is absent (automatic replication);
#   - adds a new version from NOTES_EXPORT_APP_KEY and disables the prior
#     versions;
#   - runs the remaining adds-only Terraform apply — the gate SA's secretAccessor
#     binding and the gate's GATE_NOTES_* env — with the App id and installation
#     id as TF_VARs, and TF_VAR_notes_export_enabled=true only when both are set.
#
# SECRET HYGIENE, deliberately and auditably:
#   - the value is never echoed, never passed on a command line, never written to
#     a step output or an artifact, and `set -x` is never enabled;
#   - it is written to a 0600 temp file under `umask 077` and removed by an EXIT
#     trap;
#   - GitHub additionally masks every `secrets.*` value in the log.
#
# TRIGGERS, and why there is no `pull_request`. Only `workflow_dispatch` and a
# push to `main` that changes THIS file. A `pull_request` trigger would run
# untrusted code from a fork in a context that can read repository secrets on
# some events; forks do not receive secrets, and this workflow is never wired to
# a PR event, so a crafted PR cannot reach the key. The residual risk is a
# malicious change MERGED to `main`. Merging is the owner's decision; note that
# current branch protection requires CI and conversation resolution but does NOT
# require a code-owner review, so the merge gate is the owner's judgement plus
# `.github/CODEOWNERS` as a social signal (hardening tracked in #114). The
# workflow cannot widen its own trigger without a commit to `main`.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Re-runs only when the workflow itself changes, so the push that lands
      # this file exercises it, and an unrelated main push does not.
      - .github/workflows/secrets-sync.yml

# No workflow-wide grant. Each job asks for exactly what it uses.
permissions: {}

# One sync at a time. Terraform state and the secret version list are shared, so
# overlapping runs must not race.
concurrency:
  group: secrets-sync
  cancel-in-progress: false

jobs:
  sync-secret:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout, for infra/
      id-token: write # the GitHub OIDC token exchanged through WIF
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      # The GATE deploy identity (gate.tf): it already holds run.developer on the
      # hub-gate service, which the Terraform apply needs to set GATE_NOTES_*.
      # hub-deploy deliberately cannot deploy the gate, so it is not used here.
      GCP_GATE_DEPLOY_SA: ${{ vars.GCP_GATE_DEPLOY_SA }}
      SECRET_NAME: notes-export-app-key
    outputs:
      have_key: ${{ steps.guard.outputs.have_key }}
    steps:
      # Checkout comes first: auth writes its credentials file into the
      # workspace, and a later checkout would delete it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # A repository secret that has not been set resolves to the EMPTY STRING,
      # not an error. This is the no-op gate: on a fresh install the key is
      # absent and every credentialed step below is skipped, leaving a green run.
      # The value is read only to test for emptiness; it is not echoed.
      - name: Check whether the App private key is configured
        id: guard
        env:
          NOTES_EXPORT_APP_KEY: ${{ secrets.NOTES_EXPORT_APP_KEY }}
        run: |
          if [ -z "${NOTES_EXPORT_APP_KEY}" ]; then
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::secrets.NOTES_EXPORT_APP_KEY is not set, so there is nothing to sync. Set NOTES_EXPORT_APP_KEY (secret), NOTES_EXPORT_APP_ID and NOTES_EXPORT_INSTALLATION_ID (variables) in Settings > Secrets and variables > Actions, then run 'gh workflow run secrets-sync.yml'."
          else
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.guard.outputs.have_key == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_GATE_DEPLOY_SA }}

      - name: Set up gcloud
        if: steps.guard.outputs.have_key == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The sync itself. No `set -x`, no `echo` of the value: it lands in a 0600
      # temp file and the log carries only the secret NAME and version NUMBERS.
      - name: Sync the App private key into Secret Manager
        if: steps.guard.outputs.have_key == 'true'
        env:
          NOTES_EXPORT_APP_KEY: ${{ secrets.NOTES_EXPORT_APP_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$(mktemp)"
          trap 'rm -f "${KEY_FILE}"' EXIT
          # printf, never echo: no option parsing and no added newline.
          printf '%s' "${NOTES_EXPORT_APP_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"

          if ! gcloud services list --enabled --project "${GCP_PROJECT_ID}" \
                 --filter 'config.name:secretmanager.googleapis.com' \
                 --format 'value(config.name)' | grep -qx secretmanager.googleapis.com; then
            echo "Enabling secretmanager.googleapis.com."
            gcloud services enable secretmanager.googleapis.com --project "${GCP_PROJECT_ID}"
          fi

          if ! gcloud secrets describe "${SECRET_NAME}" --project "${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            echo "Creating secret ${SECRET_NAME} (automatic replication)."
            gcloud secrets create "${SECRET_NAME}" --project "${GCP_PROJECT_ID}" \
              --replication-policy=automatic
          fi

          NEW_FULL="$(gcloud secrets versions add "${SECRET_NAME}" \
            --project "${GCP_PROJECT_ID}" --data-file="${KEY_FILE}" \
            --format 'value(name)')"
          # Never proceed on an empty version name: the disable loop below skips
          # only the new version, so an empty value would disable the one just
          # added (a self-inflicted outage, not a leak).
          if [ -z "${NEW_FULL}" ]; then
            echo "::error::could not read the new version name for ${SECRET_NAME}; aborting before disabling anything."
            exit 1
          fi
          echo "Added ${SECRET_NAME} version ${NEW_FULL##*/}."

          # Disable every prior enabled version, keeping only the one just added.
          while IFS= read -r OLD_FULL; do
            [ -z "${OLD_FULL}" ] && continue
            [ "${OLD_FULL}" = "${NEW_FULL}" ] && continue
            echo "Disabling prior version ${OLD_FULL##*/}."
            gcloud secrets versions disable "${OLD_FULL##*/}" \
              --secret "${SECRET_NAME}" --project "${GCP_PROJECT_ID}"
          done < <(gcloud secrets versions list "${SECRET_NAME}" \
                     --project "${GCP_PROJECT_ID}" --filter 'state=enabled' \
                     --format 'value(name)' || true)

          echo "::notice::${SECRET_NAME} is synced; prior versions are disabled; the value was never printed."

  # The remaining adds-only Terraform apply (D19). It follows the sync so the
  # secret it binds already exists. The main root now uses the GCS backend
  # (infra/versions.tf), so a runner can apply it.
  terraform:
    needs: sync-secret
    if: needs.sync-secret.outputs.have_key == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout, for infra/
      id-token: write # the GitHub OIDC token exchanged through WIF
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_GATE_DEPLOY_SA: ${{ vars.GCP_GATE_DEPLOY_SA }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_GATE_DEPLOY_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      # The App id and installation id are repository VARIABLES (identifiers, not
      # secrets). The sync is enabled only when both are present; otherwise the
      # apply still adds the accessor binding but leaves the gate dormant, with a
      # warning rather than a silent half-configuration.
      - name: Derive the Terraform variables from the GitHub repository variables
        env:
          NOTES_EXPORT_APP_ID: ${{ vars.NOTES_EXPORT_APP_ID }}
          NOTES_EXPORT_INSTALLATION_ID: ${{ vars.NOTES_EXPORT_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          {
            echo "TF_VAR_notes_export_app_id=${NOTES_EXPORT_APP_ID}"
            echo "TF_VAR_notes_export_installation_id=${NOTES_EXPORT_INSTALLATION_ID}"
          } >> "$GITHUB_ENV"
          if [ -n "${NOTES_EXPORT_APP_ID}" ] && [ -n "${NOTES_EXPORT_INSTALLATION_ID}" ]; then
            echo "TF_VAR_notes_export_enabled=true" >> "$GITHUB_ENV"
            echo "::notice::NOTES_EXPORT_APP_ID and NOTES_EXPORT_INSTALLATION_ID are set; notes-sync will be enabled."
          else
            echo "TF_VAR_notes_export_enabled=false" >> "$GITHUB_ENV"
            echo "::warning::NOTES_EXPORT_APP_ID and NOTES_EXPORT_INSTALLATION_ID are not both set. The accessor binding is still applied, but notes-sync stays dormant. Set both repository variables and re-run."
          fi

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      # Terraform REQUIRES every declared variable even for a `-target` apply,
      # and CI has no terraform.tfvars (`.gitignore` keeps it out). Reconstruct
      # the three values the local tfvars would have supplied, from the repository
      # variables and the live state — so the owner's step stays at the three
      # credential names:
      #   - project_id: the repository variable.
      #   - billing_account: an account identifier already in state; used only by
      #     the budget resource, which this targeted apply never touches.
      #   - gate_extra_allowed_origins (#62): the legacy *.a.run.app hash spelling
      #     gate.yml uses as an Origin. Without it the apply would DROP it and
      #     refuse a legitimate sign-out. Rebuilt as the service's current
      #     GATE_ALLOWED_ORIGINS minus Terraform's computed base (site domain +
      #     project-number URL).
      - name: Supply the required Terraform variables CI does not store
        working-directory: infra
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_GATE_SERVICE: ${{ vars.GCP_GATE_SERVICE }}
          GCP_GATE_REGION: ${{ vars.GCP_GATE_REGION }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          echo "TF_VAR_project_id=${GCP_PROJECT_ID}" >> "$GITHUB_ENV"

          BILLING="$(terraform show -json \
            | jq -r '.. | objects | select(.type? == "google_billing_budget") | .values.billing_account? // empty' \
            | head -n1)"
          if [ -z "${BILLING}" ]; then
            echo "::error::could not read the billing account from the Terraform state, so the required TF_VAR_billing_account is unset. Run the local apply once, or set it explicitly."
            exit 1
          fi
          echo "::add-mask::${BILLING}"
          echo "TF_VAR_billing_account=${BILLING}" >> "$GITHUB_ENV"

          SERVICE="${GCP_GATE_SERVICE:-hub-gate}"
          REGION="${GCP_GATE_REGION:-us-east1}"
          PROJECT_NUMBER="$(printf '%s' "${GCP_WIF_PROVIDER}" | sed -E 's|^projects/([0-9]+)/.*|\1|')"
          BASE_DOMAIN="${SITE_URL%/}"
          BASE_NUMBER="https://${SERVICE}-${PROJECT_NUMBER}.${REGION}.run.app"
          CURRENT="$(terraform show -json \
            | jq -r '.. | objects | select(.name? == "GATE_ALLOWED_ORIGINS") | .value' \
            | head -n1)"
          EXTRAS="$(printf '%s' "${CURRENT}" | tr ',' '\n' \
            | grep -vx -e "${BASE_DOMAIN}" -e "${BASE_NUMBER}" | grep -v '^$' || true)"
          if [ -n "${EXTRAS}" ]; then
            EXTRA_JSON="$(printf '%s' "${EXTRAS}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            echo "TF_VAR_gate_extra_allowed_origins=${EXTRA_JSON}" >> "$GITHUB_ENV"
            echo "::notice::carried ${EXTRA_JSON} into gate_extra_allowed_origins from the live state, so the apply does not drop it."
          fi

      # A scoped apply. `-target` limits the plan to the two resources D19 can
      # change and their (unchanged, read-only) dependency closure, so no other
      # resource can be modified even if the state drifts. `-refresh=false` is
      # deliberate: the CI identity is deliberately narrow (it cannot read every
      # resource in the state), so the plan is computed from the stored state.
      # The Cloud Run image is `ignore_changes` (gate.tf), so a gate.yml image
      # deploy is never reverted. The plan is saved and then applied, so the
      # applied plan is the one this step logged.
      - name: Terraform plan (the adds-only change)
        working-directory: infra
        run: |
          terraform plan -input=false -refresh=false -lock-timeout=5m \
            -target=google_secret_manager_secret_iam_member.hub_gate_notes_export_key \
            -target=google_cloud_run_v2_service.gate \
            -out=tfplan

      - name: "Terraform apply (adds-only — the notes-sync secret accessor binding and the gate env)"
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan
