name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# No workflow-wide grant. Each job asks for exactly what it uses.
permissions: {}

# Real deploys (push/schedule/manual) stay serialized under a single "pages"
# group so they never race each other. PR validation builds get their own
# per-branch group -- they never deploy, so they must not queue behind (or hold
# up) the deploy lane, and a new push to a PR supersedes the run in flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two hosts are built from every commit until Phase 6 (ADR-0001 Decision 4;
# phase-1-seams.md SEAM-5):
#   - GitHub Pages at https://djjay0131.github.io/website/ -- live and
#     authoritative, deployed exactly as before;
#   - Firebase Hosting -- deployed only once the owner sets the GitHub Actions
#     variable GCP_PROJECT_ID (with GCP_WIF_PROVIDER and GCP_DEPLOY_SA, the
#     outputs of infra/). Until then the Firebase jobs are skipped.
#
# PHASE 2 (ADR-0007, ADR-0008; phase-2-seams.md SEAM-4, SEAM-5). The hub no
# longer learns of a publish by being told: `repository_dispatch: [cv-updated]`
# is GONE, because any credential able to fire it at this repository could also
# write to it. Satellites publish to the content bucket and hold no GitHub
# credential for `website`; the hub polls the bucket on the hourly schedule,
# fingerprints it, and rebuilds when the fingerprint differs from the deployed
# build. `workflow_dispatch` remains the owner's escape hatch for "publish this
# now", and needs no satellite credential at all: a manual run always builds.
#
# WHERE THE CV DATA COMES FROM, per trigger. Every trigger has a source; no
# build on any trigger produces a site without the CV, because GitHub Pages is
# authoritative until Phase 6 and serves live CV links.
#
#   push / schedule / workflow_dispatch, once vars.GCP_CONTENT_BUCKET is set
#       -> scripts/sync-content.sh --bucket : the content bucket. The contract
#          path, and the only one after Checkpoint 3 on the deploy lane.
#   pull_request
#       -> scripts/fetch-data.sh : the cv GitHub release. A PR run carries
#          refs/pull/<n>/merge and the deploy binding admits only
#          refs/heads/main (infra/wif.tf), so it CANNOT authenticate to read the
#          bucket. Without this fallback every PR would build a CV-less site and
#          fail check:smoke-routes on /cv/academic.
#   any trigger while vars.GCP_CONTENT_BUCKET is unset
#       -> scripts/fetch-data.sh : covers the window between merging Phase 2 and
#          the owner applying Terraform and setting the variable at Checkpoint 3.
#
# Both sources produce the SAME bucket-shaped tree under
# site/src/content/sources/ and the same manifest, so everything downstream --
# manifest validation in site/src/content.config.ts, the data-item claim check,
# public-asset staging, the CV pages -- is identical either way. Only the
# transport differs. The fallback is retired when the bucket path is proven;
# see the Phase 2 site handoff.
#
# Actions are pinned by full commit SHA with the version in a comment, as in
# ci.yml, so a retagged action cannot change this pipeline without a commit.

jobs:
  # The poll (ADR-0007 decision 1; SEAM-4). This site has no CV content of its
  # own. The hourly schedule exists to notice a publish, but almost every poll
  # finds nothing new and would rebuild identical bytes. Fingerprint the source
  # and compare against the fingerprint recorded in the currently deployed
  # build; skip the pipeline when they match.
  #
  # HOW DELETIONS ARE COVERED. The bucket fingerprint is a SHA-256 over the
  # sorted listing of EVERY object under sources/ -- one line per object,
  # "<name> <generation> <size>" (scripts/sync-content.sh). Deleting an object
  # removes its line, so the hash changes just as surely as adding or replacing
  # one does. This is deliberate: a fingerprint built from "the newest object"
  # or "the latest published timestamp" would NOT change when an item is
  # withdrawn, and a withdrawn item that leaves the site looking unchanged is a
  # defect (ADR-0007 Risks: "a fingerprint that misses deletions would leave
  # withdrawn content on the site").
  #
  # Only scheduled polls are eligible to skip. Pushes, PRs and manual runs
  # always build -- they imply the inputs or the site code changed, which the
  # fingerprint alone would not catch, and workflow_dispatch is the owner's
  # "publish now" escape hatch.
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout, for scripts/sync-content.sh
      id-token: write # the GitHub OIDC token exchanged through WIF (ADR-0007 decision 7)
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      use_bucket: ${{ steps.final.outputs.use_bucket }}
      content_fingerprint: ${{ steps.compare.outputs.content_fingerprint }}
      cv_fingerprint: ${{ steps.compare.outputs.cv_fingerprint }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # One decision, made once and reused by every job below, so the poll and
      # the builds can never disagree about where the content came from.
      - name: Decide which CV data source this run uses
        id: mode
        env:
          CONTENT_BUCKET: ${{ vars.GCP_CONTENT_BUCKET }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          USE_BUCKET=true
          REASON=""
          if [ -z "${CONTENT_BUCKET}" ]; then
            USE_BUCKET=false
            REASON="vars.GCP_CONTENT_BUCKET is not set (Checkpoint 3 has not been run yet)"
          elif [ -z "${GCP_PROJECT_ID}" ] || [ -z "${GCP_WIF_PROVIDER}" ] || [ -z "${GCP_DEPLOY_SA}" ]; then
            USE_BUCKET=false
            REASON="GCP_CONTENT_BUCKET is set but GCP_PROJECT_ID, GCP_WIF_PROVIDER or GCP_DEPLOY_SA is not (see infra/README.md)"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            USE_BUCKET=false
            REASON="a pull_request run carries refs/pull/<n>/merge, and the deploy binding admits only refs/heads/main (infra/wif.tf), so it cannot read the bucket"
          fi
          echo "use_bucket=${USE_BUCKET}" >> "$GITHUB_OUTPUT"
          if [ "${USE_BUCKET}" = "true" ]; then
            echo "::notice::CV data source: the content bucket (the Phase 2 contract path)."
          else
            echo "::notice::CV data source: the cv GitHub release (fallback) -- ${REASON}."
          fi

      # Writes an external_account credentials file and exports
      # GOOGLE_APPLICATION_CREDENTIALS; token_format: access_token additionally
      # mints the OAuth token the sync script uses directly. A scheduled run
      # carries ref refs/heads/main, so the existing binding admits it and no
      # new binding is needed (ADR-0007 decision 7).
      - name: Authenticate to Google Cloud
        id: auth
        if: steps.mode.outputs.use_bucket == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      # Two object operations and nothing else: objects.list to enumerate, and
      # (in the build jobs) objects.get to download. The hub's grant is
      # roles/storage.objectViewer on the bucket, which does NOT include
      # storage.buckets.get, so nothing here reads bucket metadata.
      - name: Fingerprint the content bucket
        id: bucket
        if: steps.mode.outputs.use_bucket == 'true'
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONTENT_BUCKET: ${{ vars.GCP_CONTENT_BUCKET }}
        run: |
          FP="$(site/scripts/sync-content.sh --fingerprint --bucket "${CONTENT_BUCKET}")"
          echo "content_fingerprint=${FP}" >> "$GITHUB_OUTPUT"
          echo "content fingerprint: ${FP}"

      # An empty bucket is a real state, not a fault: it is how the system looks
      # before any satellite has ever published. sync-content.sh gives it the
      # stable fingerprint "empty" for exactly this purpose.
      #
      # Falling back here is what keeps `main` buildable between the moment
      # Checkpoint 3 sets GCP_CONTENT_BUCKET and the moment the first satellite
      # publishes. Without it the hub syncs nothing, and every job downstream
      # fails on a tree that was never populated (issue #19).
      #
      # This does NOT weaken the rule that a source which HAS published and then
      # lost its manifest fails the build. Those are different states and stay
      # distinguishable: "empty" means the bucket holds no objects at all, while
      # a vanished manifest leaves objects behind and still fails in the sync.
      - name: Fall back when the bucket holds no published content yet
        id: final
        env:
          PROVISIONAL: ${{ steps.mode.outputs.use_bucket }}
          CONTENT_FINGERPRINT: ${{ steps.bucket.outputs.content_fingerprint }}
        run: |
          USE_BUCKET="${PROVISIONAL}"
          if [ "${PROVISIONAL}" = "true" ] && [ "${CONTENT_FINGERPRINT}" = "empty" ]; then
            USE_BUCKET=false
            echo "::notice::CV data source: the cv GitHub release (fallback) -- the content bucket is reachable but no satellite has published to it yet. This is the expected state until cv publishes for the first time."
          fi
          echo "use_bucket=${USE_BUCKET}" >> "$GITHUB_OUTPUT"

      - name: Fingerprint the cv release
        id: release
        if: steps.final.outputs.use_bucket != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FP=$(gh release view latest --repo djjay0131/cv --json assets \
            --jq '[.assets[] | "\(.name):\(.updatedAt)"] | sort | join(",")')
          echo "cv_fingerprint=${FP}" >> "$GITHUB_OUTPUT"
          echo "cv release fingerprint: ${FP}"

      - name: Compare against the deployed build
        id: compare
        env:
          EVENT_NAME: ${{ github.event_name }}
          USE_BUCKET: ${{ steps.final.outputs.use_bucket }}
          CONTENT_FINGERPRINT: ${{ steps.bucket.outputs.content_fingerprint }}
          CV_FINGERPRINT: ${{ steps.release.outputs.cv_fingerprint }}
          # SEAM-5: read the deployed build info from SITE_URL when the owner has
          # set it, else from GitHub Pages.
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          echo "content_fingerprint=${CONTENT_FINGERPRINT}" >> "$GITHUB_OUTPUT"
          echo "cv_fingerprint=${CV_FINGERPRINT}" >> "$GITHUB_OUTPUT"

          if [ "${USE_BUCKET}" = "true" ]; then
            FIELD="content_fingerprint"
            CURRENT="${CONTENT_FINGERPRINT}"
          else
            FIELD="cv_fingerprint"
            CURRENT="${CV_FINGERPRINT}"
          fi

          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "${EVENT_NAME} run -- building unconditionally."
            exit 0
          fi

          DEPLOYED_SITE="${SITE_URL:-https://djjay0131.github.io/website}"
          DEPLOYED_SITE="${DEPLOYED_SITE%/}"
          echo "reading deployed build info from ${DEPLOYED_SITE}/build-info.json"

          # A missing or unreadable build-info.json (first run after this
          # lands, or a failed deploy) falls through to "changed" and builds.
          # So does a deployed build recorded against the OTHER source: after
          # Checkpoint 3 the first scheduled poll finds no content_fingerprint
          # and rebuilds once, which is correct.
          DEPLOYED=$(curl -sfL "${DEPLOYED_SITE}/build-info.json" \
            | jq -r ".${FIELD} // \"\"" 2>/dev/null || true)
          echo "deployed ${FIELD}: ${DEPLOYED:-<none>}"

          if [ -n "${DEPLOYED}" ] && [ "${DEPLOYED}" = "${CURRENT}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::published content unchanged since the deployed build; skipping build and deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Budget presence check (design doc §12.6: the budget alert is never removed).
  # prevent_destroy in infra/budget.tf stops a destroy only while the resource
  # block is in the configuration; deleting the block or the file would destroy
  # the budget in one apply. Terraform override files (override.tf*,
  # *_override.tf*) merge into resource blocks, lifecycle argument by argument,
  # so a tracked override could switch the guard off while budget.tf is
  # unchanged. This job fails on either, before any apply.
  #
  # It runs on EVERY trigger, independently of vars.GCP_PROJECT_ID, and deploys
  # nothing. Both notification jobs need it: a skipped run would let
  # notify-recovery close the tracking issue while main still lacks the guard
  # (delta review B1). Comments are stripped first, so a commented-out block or
  # guard does not pass; whitespace is free.
  budget-guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check no Terraform override file is tracked under infra/
        run: |
          TRACKED_FILES="$(git -c core.quotePath=false ls-files -- infra)"
          FOUND=0
          while IFS= read -r TRACKED; do
            case "$(basename -- "${TRACKED:-.}")" in
              override.tf* | *_override.tf*)
                echo "::error file=${TRACKED}::${TRACKED} is a Terraform override file. Overrides merge into resource blocks, lifecycle argument by argument, and can disable prevent_destroy on the budget. None may be tracked under infra/."
                FOUND=1
                ;;
            esac
          done <<< "${TRACKED_FILES}"
          if [ "${FOUND}" -eq 0 ]; then
            echo "OK: no override.tf* or *_override.tf* file is tracked under infra/."
          fi
          exit "${FOUND}"

      # Runs even if the override check failed, so both problems are reported.
      - name: Check the budget and its prevent_destroy guard are declared
        if: ${{ !cancelled() }}
        env:
          FILE: infra/budget.tf
        run: |
          if [ ! -f "${FILE}" ]; then
            echo "::error file=${FILE}::${FILE} is missing. The \$5 budget is never removed (design doc §12.6)."
            exit 1
          fi
          set +e
          perl -0777 -ne '
            s{/\*.*?\*/}{}gs;
            s{(?:#|//)[^\n]*}{}g;
            unless (/\bresource\s+"?google_billing_budget"?\s+"?hub"?\s*(\{(?:[^{}]++|(?1))*\})/) { exit 2 }
            my $block = $1;
            unless ($block =~ /\blifecycle\s*(\{(?:[^{}]++|(?1))*\})/ && $1 =~ /\bprevent_destroy\s*=\s*true\b/) { exit 3 }
          ' "${FILE}"
          RC=$?
          set -e
          case "${RC}" in
            0) echo "OK: ${FILE} declares google_billing_budget.hub with prevent_destroy = true." ;;
            2) echo "::error file=${FILE}::${FILE} does not declare resource \"google_billing_budget\" \"hub\". The \$5 budget is never removed (design doc §12.6)."; exit 1 ;;
            3) echo "::error file=${FILE}::google_billing_budget.hub in ${FILE} has no lifecycle { prevent_destroy = true }."; exit 1 ;;
            *) echo "::error file=${FILE}::budget check could not run (perl exit ${RC})."; exit 1 ;;
          esac

      # THE EXECUTABLE-BIT GUARD (Chief Reviewer S6; Phase 2's exit-126 defect).
      #
      # WHERE THE MODE COMES FROM, and this is the whole point of the check.
      # Modes are read from the INDEX via `git ls-files -s`, and file contents
      # from the index blob via `git cat-file -p :<path>`. NOTHING here stats the
      # working tree. This repository is developed on /mnt/c, a DrvFs mount that
      # reports every file as 0777, so `ls -l`, `stat` and anything else reading
      # the filesystem says "executable" about a file that is committed 100644 --
      # it runs perfectly locally and dies on the runner with exit 126. A guard
      # that read the working tree would fall into the exact defect it exists to
      # prevent. git is additionally invoked with -c core.fileMode=false so the
      # mount cannot perturb the guard's own process.
      #
      # HOW FILES ARE CLASSIFIED: by how a file is REACHED, not how its path is
      # spelled. That distinction is load-bearing. Eight tracked *.mjs files
      # carry a shebang while committed 100644, and not one of them is a defect:
      # every one is reached through `node …` or an ES `import`, never executed.
      # A spelling-based scan flags all eight, because `import "./x.mjs"` and a
      # shell invocation look identical to a grep. A guard that cries wolf gets
      # switched off, and then the invariant is unprotected and nobody notices.
      #
      # THREE RULES, so the guard has signal in both directions:
      #   A. a tracked *.sh beginning with a shebang must be 100755 (SEAM-9);
      #   B. any tracked file INVOKED DIRECTLY anywhere must be 100755 -- direct
      #      meaning it appears at a command position in a shell surface
      #      (workflow `run:` blocks, *.sh files, package.json "scripts",
      #      composite action.yml) and is NOT preceded by an interpreter;
      #   C. a tracked shebang file that is neither *.sh nor directly invoked
      #      must NOT be 100755 -- an executable bit on a module is a false
      #      signal, and rule C is what keeps the classification honest rather
      #      than letting everything drift to 755 to silence rule B.
      #
      # Comments are stripped from shell surfaces before rule B looks for an
      # invocation, because prose like "# -> scripts/fetch-data.sh" is not a call
      # site. The tradeoff is deliberate and one-directional: stripping can only
      # cause rule B to miss a call site, never to invent one, and rule A still
      # covers every *.sh unconditionally.
      - name: Check the executable bit on every tracked script
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json, re, subprocess, sys

          INTERPRETERS = {
              "node", "nodejs", "npx", "python", "python3", "py", "bash", "sh",
              "dash", "zsh", "ksh", "perl", "ruby", "deno", "bun", "uv", "uvx",
              "source", ".", "exec", "time", "env",
          }

          def git(*args):
              return subprocess.run(["git", "-c", "core.fileMode=false", *args],
                                    capture_output=True, text=True, check=True).stdout

          # Modes from the INDEX. Never the working tree -- see the header.
          modes = {}
          for line in git("ls-files", "-s").splitlines():
              meta, path = line.split("\t", 1)
              modes[path] = meta.split()[0]

          def blob(path):
              try:
                  return subprocess.run(["git", "cat-file", "-p", f":{path}"],
                                        capture_output=True, check=True).stdout
              except subprocess.CalledProcessError:
                  return b""

          shebang = {p for p in modes if blob(p)[:2] == b"#!"}

          def strip_comments(text):
              return re.sub(r"(?m)(?:^|\s)#[^\n]*", "", text)

          # Only surfaces that EXECUTE things. Deliberately excludes *.mjs/*.js:
          # an `import` is not an invocation, and scanning module source is what
          # produces the eight false positives described above.
          surfaces = []
          for p in sorted(modes):
              if (p.startswith(".github/workflows/") and p.endswith((".yml", ".yaml"))) \
                 or p.endswith(("action.yml", "action.yaml", ".sh", "Dockerfile")):
                  surfaces.append((p, strip_comments(blob(p).decode("utf-8", "replace"))))
              elif p.endswith("package.json"):
                  try:
                      scripts = (json.loads(blob(p).decode("utf-8", "replace")) or {}).get("scripts")
                  except ValueError:
                      continue
                  if isinstance(scripts, dict):
                      surfaces.append((p, "\n".join(str(v) for v in scripts.values())))

          TOKEN = re.compile(r"[^\s;&|()`'\"]+")

          def direct_invocations(path):
              base = path.rsplit("/", 1)[-1]
              hits = []
              for surface, text in surfaces:
                  for line in text.splitlines():
                      toks = TOKEN.findall(line)
                      for i, tok in enumerate(toks):
                          cand = tok.lstrip("$({").rstrip("\"'`,;)")
                          if cand not in (path, "./" + path, base, "./" + base) \
                             and not cand.endswith("/" + base):
                              continue
                          prev = (toks[i - 1] if i else "").strip("\"'`")
                          if prev.rsplit("/", 1)[-1] in INTERPRETERS:
                              continue  # `node x.mjs` / `bash x.sh` -- interpreted, not executed
                          hits.append((surface, line.strip()))
              return hits

          failures = []
          print(f"{'mode':7} {'kind':10} {'reached':14} path")
          for path in sorted(shebang | {p for p in modes if modes[p] == "100755"}):
              mode = modes[path]
              hits = direct_invocations(path)
              is_sh = path.endswith(".sh")
              kind = "shell" if is_sh else ("shebang" if path in shebang else "plain")
              reached = "executed" if hits else "interpreted"
              print(f"{mode:7} {kind:10} {reached:14} {path}")
              for surface, line in hits[:2]:
                  print(f"{'':33}<- {surface}: {line[:80]}")

              if is_sh and path in shebang and mode != "100755":
                  failures.append((path, f"is a *.sh beginning with a shebang but is committed {mode}. "
                                         f"Fix: git update-index --chmod=+x {path}"))
              elif hits and mode != "100755":
                  where = hits[0][0]
                  failures.append((path, f"is invoked directly ({where}) but is committed {mode}. "
                                         f"Running it fails on Linux with exit 126. "
                                         f"Fix: git update-index --chmod=+x {path}"))
              elif not is_sh and not hits and mode == "100755":
                  failures.append((path, f"is committed 100755 but nothing invokes it directly -- it is "
                                         f"reached through an interpreter or an import. An executable bit "
                                         f"here is a false signal. Either invoke it directly, or fix with: "
                                         f"git update-index --chmod=-x {path}"))

          for path, message in failures:
              print(f"::error file={path}::{path} {message}")
          if failures:
              print(f"\n{len(failures)} executable-bit violation(s).")
              sys.exit(1)
          print(f"\nOK: {len(shebang)} shebang file(s) checked. Every *.sh and every directly "
                f"invoked file is committed 100755; every interpreted module is committed 100644.")
          PY

      # Chief Reviewer S5, and the infra stream's own recommendation. These are the
      # two invariants that fail OPEN rather than loudly:
      #   - without uniform bucket-level access an IAM condition does not apply at
      #     all, so every satellite's prefix binding silently widens to the whole
      #     bucket, with nothing anywhere looking different;
      #   - storage.objects.list cannot be restricted by prefix, so a satellite
      #     granted it could enumerate every other source's object names -- in
      #     Phase 3, the private ones.
      # Neither produces an error, which is why they are asserted here rather than
      # trusted to review. Same reasoning as the budget check above.
      # Design doc §12.1 is a non-negotiable: "No private content in public
      # output. Build-time check, bucket IAM test, both on every deploy." The
      # build-time check runs above; this is the bucket half, and until now it ran
      # NOWHERE while three documents claimed it ran on every push.
      #
      # It lives in budget-guard on purpose. budget-guard is already a required
      # status check on main, so the assertion binds from the moment it lands
      # rather than waiting on a branch-protection change.
      #
      # Credential-free: it reads the Terraform, not the live policy. It asserts
      # uniform bucket-level access, enforced public access prevention, no
      # anonymous principal, and EXACTLY two bindings -- the gate with
      # storage.objects.get, and the hub's sync with create/delete/get/list
      # (SEAM-1, ADR-0010 decision 5). It also asserts that the read-only
      # auditor role added for the live check holds no storage.objects.*
      # permission at all (infra/auditor.tf).
      #
      # The LIVE half needs credentials and now runs in the
      # private-bucket-live-iam job below, on the schedule and on main. It used
      # to say "and is a Checkpoint 4 procedure" here, which is how it came to
      # run nowhere for two phases (#58).
      - name: Check the private bucket's declared IAM (design doc 12.1)
        run: python3 infra/scripts/check_private_bucket_config.py

      # THE SATELLITE-ROLE GUARD (Phase 2 infra recommendation; Chief Reviewer S5;
      # ADR-0007 decisions 4 and 8).
      #
      # Every assertion here is about a breakage that is INVISIBLE -- nothing
      # errors, nothing looks different, and the boundary is simply gone:
      #
      #   1. UBLA on BOTH buckets. This is the one that fails OPEN. With uniform
      #      bucket-level access off, an IAM condition does not apply AT ALL, so
      #      every satellite's prefix binding silently widens to the whole bucket
      #      and object ACLs come back. Nothing reports an error anywhere. That is
      #      the defect class this guard exists for.
      #   2. satellite_publisher holds exactly create/delete/get and NEVER list.
      #      storage.objects.list cannot be restricted to a prefix, so one
      #      satellite holding it enumerates every other source -- in Phase 3, the
      #      private ones.
      #   3. No satellite binding may use a PREDEFINED role. Every predefined
      #      Cloud Storage role that can read an object also carries
      #      storage.objects.list, so swapping the custom role for
      #      roles/storage.objectViewer would re-grant list while the permission
      #      list in satellite-role.tf still read correctly. ADR-0007 decision 4
      #      is explicit: not in this role, NOT IN ANY OTHER ROLE granted to a
      #      satellite, conditioned or not.
      #   4. Every satellite binding carries a prefix condition. An unconditioned
      #      binding of the correct role still covers the whole bucket.
      #   5. No satellite holds a project-level role at all.
      #
      # Credential-free: it reads the Terraform, not the live policy. The private
      # bucket's own two-principal invariant is asserted by the step above
      # (check_private_bucket_config.py); the live half runs in the
      # private-bucket-live-iam job (infra/scripts/check-private-bucket-iam.sh),
      # and the step after this one asserts that it is still wired to a job that
      # actually runs.
      - name: Check the satellite boundary invariants are declared
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import re, sys

          failures = []

          def fail(path, message):
              failures.append((path, message))

          def source(path):
              # Comments are stripped first: these files explain at length WHY
              # storage.objects.list is absent, so matching raw text would pass
              # on prose and assert nothing.
              with open(path, encoding="utf-8") as fh:
                  return re.sub(r"#[^\n]*", "", fh.read())

          def blocks(text, resource_type):
              """Yield (name, body) for each resource block, brace-matched."""
              for match in re.finditer(r'resource\s+"%s"\s+"([A-Za-z0-9_]+)"\s*\{' % resource_type, text):
                  depth, i = 1, match.end()
                  while i < len(text) and depth:
                      depth += (text[i] == "{") - (text[i] == "}")
                      i += 1
                  yield match.group(1), text[match.end():i - 1]

          storage = source("infra/storage.tf")
          private = source("infra/private-bucket.tf")
          satellites = source("infra/satellites.tf")
          role_file = source("infra/satellite-role.tf")

          # 1. UBLA on BOTH buckets.
          for path, text, resource in (
              ("infra/storage.tf", storage, "google_storage_bucket.content"),
              ("infra/private-bucket.tf", private, "google_storage_bucket.private"),
          ):
              if not re.search(r"\buniform_bucket_level_access\s*=\s*true\b", text):
                  fail(path, f"{resource} must set uniform_bucket_level_access = true. Without it "
                             f"no IAM condition applies, every prefix binding covers the whole "
                             f"bucket, and object ACLs are re-enabled -- the boundary fails OPEN "
                             f"with no error anywhere (ADR-0007 decision 8).")

          # 2. The role holds exactly its three permissions.
          perms = []
          for name, body in blocks(role_file, "google_project_iam_custom_role"):
              if name == "satellite_publisher":
                  listed = re.search(r"permissions\s*=\s*\[(.*?)\]", body, re.S)
                  perms = sorted(re.findall(r'"([^"]+)"', listed.group(1))) if listed else []
          want = ["storage.objects.create", "storage.objects.delete", "storage.objects.get"]
          if perms != want:
              fail("infra/satellite-role.tf",
                   f"satellite_publisher must grant exactly {want} -- got {perms}. "
                   f"storage.objects.list in particular cannot be restricted to a prefix "
                   f"(ADR-0007 decision 4).")

          # 3 and 4. Every content-bucket binding whose member is a satellite must
          # use the custom role AND carry a prefix condition.
          satellite_bindings = 0
          for name, body in blocks(satellites, "google_storage_bucket_iam_member"):
              if "google_service_account.satellite_publish" not in body:
                  continue
              satellite_bindings += 1
              role_line = re.search(r"role\s*=\s*([^\n]+)", body)
              role_value = role_line.group(1).strip() if role_line else "<none>"
              if role_value != "google_project_iam_custom_role.satellite_publisher.name":
                  fail("infra/satellites.tf",
                       f'binding "{name}" grants a satellite the role {role_value}. A satellite may '
                       f"hold ONLY google_project_iam_custom_role.satellite_publisher: every "
                       f"predefined Cloud Storage role that can read an object also carries "
                       f"storage.objects.list (ADR-0007 decision 4).")
              if not re.search(r"\bcondition\s*\{", body) or "startsWith" not in body:
                  fail("infra/satellites.tf",
                       f'binding "{name}" has no prefix condition using startsWith. An '
                       f"unconditioned binding of the correct role still covers the WHOLE content "
                       f"bucket, not one sources/<source>/ prefix.")
          if satellite_bindings == 0:
              fail("infra/satellites.tf",
                   "no google_storage_bucket_iam_member binding references "
                   "google_service_account.satellite_publish. Either the satellite grant was "
                   "removed, or it was renamed and this guard is now asserting nothing.")

          # 5. No satellite holds a project-level role.
          for path, text in (("infra/satellites.tf", satellites), ("infra/storage.tf", storage)):
              for name, body in blocks(text, "google_project_iam_member"):
                  if "google_service_account.satellite_publish" in body:
                      fail(path, f'"{name}" grants a satellite a PROJECT-level role. A satellite '
                                 f"holds no project role at all -- its only grant is the "
                                 f"prefix-conditioned bucket binding (ADR-0007 decision 3).")

          for path, message in failures:
              print(f"::error file={path}::{message}")
          if failures:
              print(f"\n{len(failures)} satellite boundary invariant(s) violated.")
              sys.exit(1)
          print(f"OK: uniform bucket-level access is declared on BOTH buckets; satellite_publisher "
                f"holds exactly {want} and never storage.objects.list; all {satellite_bindings} "
                f"satellite binding(s) use that custom role with a startsWith prefix condition; "
                f"and no satellite holds a project-level role.")
          PY

      # THE WIRING GUARD (issue #58). Every other step in this job checks the
      # CONFIGURATION. This one checks that the one check which cannot run here
      # -- the live bucket IAM test, which needs a credential -- is still
      # attached to a job that actually runs.
      #
      # WHY IT EXISTS. Before Wave 0, infra/scripts/check-private-bucket-iam.sh
      # was referenced by this workflow in exactly one place: a COMMENT. No job
      # invoked it. Meanwhile infra/README.md, the roadmap and the Phase 3
      # handoff all described it as the mitigation for a live exposure. A
      # missing guard and a working guard look identical from outside, and this
      # is the fifth time that shape has been found in this sprint.
      #
      # THE WORKFLOW IS PARSED, NOT GREPPED, and that is the whole design. The
      # exact state this guard exists to prevent is one where the only mention
      # of the script is prose -- and a comment does not survive yaml.safe_load.
      # A grep-based version of this guard would have passed happily on the
      # state that produced #58.
      - name: Check the live bucket IAM check is wired to a job that runs
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          try:
              import yaml
          except ImportError:
              # FAIL CLOSED. A guard that cannot run must not report success:
              # that is the defect class this whole job exists for.
              print("::error file=.github/workflows/build.yml::PyYAML is not "
                    "available on this runner, so the live-check wiring could not be "
                    "verified. This guard fails closed rather than passing silently.")
              sys.exit(1)

          WORKFLOW = ".github/workflows/build.yml"
          SCRIPT = "infra/scripts/check-private-bucket-iam.sh"

          failures = []

          def fail(message):
              failures.append(message)

          # The F-1 lesson: a guard whose subject has been DELETED must go red,
          # not quietly assert nothing.
          if not os.path.exists(SCRIPT):
              fail(f"{SCRIPT} does not exist. The live half of the §12.1 bucket IAM "
                   f"test is the only check that can see an IAM grant made outside "
                   f"this repository; it is not optional.")

          with open(WORKFLOW, encoding="utf-8") as handle:
              workflow = yaml.safe_load(handle)

          # YAML 1.1 parses a bare `on:` key as the boolean True. Read both.
          triggers = workflow.get("on", workflow.get(True)) or {}
          if "schedule" not in triggers:
              fail(f"{WORKFLOW} has no `schedule:` trigger. The live bucket IAM check "
                   f"must run on a schedule: an exposure introduced by a console "
                   f"action changes no file here, so a check that runs only on a code "
                   f"change cannot see it (#55 is exactly that shape).")

          # "Mentions the path" is NOT "invokes it" -- a distinction this guard
          # learned about itself. Its own source contains the path as a string
          # literal, so a substring test made THIS step look like the call site
          # and reported the wrong job. The path must appear at a COMMAND
          # position: start of a line, after optional env assignments and an
          # optional interpreter. Same reasoning as the executable-bit guard
          # above, which classifies by how a file is reached rather than by how
          # its name is spelled.
          INVOCATION = re.compile(
              r"(?m)^[ \t]*(?:[A-Za-z_][A-Za-z0-9_]*=\S*[ \t]+)*"
              r"(?:(?:bash|sh)[ \t]+)?\.?/?" + re.escape(SCRIPT) + r"\b"
          )

          jobs = workflow.get("jobs") or {}
          invoking = [
              (name, job, step)
              for name, job in jobs.items()
              for step in (job.get("steps") or [])
              if INVOCATION.search(step.get("run") or "")
          ]

          if not invoking:
              fail(f"no job in {WORKFLOW} runs {SCRIPT}. It was referenced only from a "
                   f"comment for two phases while three documents claimed it ran on "
                   f"every deploy (#58). A comment is not a call site.")

          for name, job, step in invoking:
              condition = str(job.get("if", ""))

              if "schedule" not in condition:
                  fail(f'job "{name}" runs {SCRIPT}, but its `if:` does not admit the '
                       f"schedule event. Deploy-triggered runs catch drift only within "
                       f"a deploy cycle and only when someone pushes; the scheduled run "
                       f"is the half that catches a change made outside this repository.")

              # The job must not be conditioned on the auditor variable: an
              # unset variable would then SKIP the job, and a skipped guard is
              # the failure mode this file has now hit five times. The step
              # inside fails loudly instead.
              if "GCP_AUDITOR_SA" in condition:
                  fail(f'job "{name}" is conditioned on vars.GCP_AUDITOR_SA. That makes an '
                       f"unset variable SKIP the live check silently. The job must run and "
                       f"its first step must FAIL when the variable is missing.")

              if job.get("continue-on-error") or step.get("continue-on-error"):
                  fail(f'job "{name}" (or its live-check step) sets continue-on-error, so '
                       f"the check reports and exits 0. It must fail the job it runs in.")

              notified = jobs.get("notify-failure", {}).get("needs") or []
              if name not in notified:
                  fail(f'job "{name}" is not in notify-failure\'s `needs`, so a live IAM '
                       f"failure would page nobody. A scheduled check that fails "
                       f"invisibly is not a check.")

          for message in failures:
              print(f"::error file={WORKFLOW}::{message}")
          if failures:
              print(f"\n{len(failures)} live-check wiring violation(s).")
              sys.exit(1)

          names = ", ".join(sorted(name for name, _, _ in invoking))
          print(f"OK: {SCRIPT} is invoked by job(s) [{names}], on triggers "
                f"{sorted(triggers)}, with no continue-on-error, and a failure pages "
                f"through notify-failure.")
          PY

  # THE LIVE HALF OF THE §12.1 BUCKET IAM TEST (issues #58 and #55).
  #
  # "The bucket IAM test runs on every deploy and fails if the private bucket
  # grants public access or any reader other than the gate's service account."
  # The credential-free half (check_private_bucket_config.py, in budget-guard
  # above) reads the Terraform. THIS is the half that reads the actual policy,
  # and until Wave 0 it ran nowhere at all.
  #
  # WHAT EACH TRIGGER CATCHES, AND WHAT IT DOES NOT -- stated because choosing
  # only one of them was the mistake that produced #58's disposition:
  #
  #   schedule (hourly, the existing cron -- THE LOAD-BEARING ONE)
  #     CATCHES: anything granted outside this repository. A console click, a
  #       `gcloud projects add-iam-policy-binding`, a role added to a service
  #       account, an inherited grant from a new org policy. This is exactly how
  #       #55 arises: granting roles/editor touches no file here, so no
  #       code-triggered check can ever see it.
  #     DOES NOT CATCH: nothing that has happened yet at the moment it runs --
  #       it has an up-to-one-hour blind window, and it reports drift rather
  #       than preventing it.
  #
  #   push to main
  #     CATCHES: drift within one deploy cycle, and gives the merge a live
  #       verdict rather than a configuration-only one.
  #     DOES NOT CATCH: the pull request that introduced the change -- the PR
  #       run cannot authenticate at all, see below -- and nothing at all during
  #       a quiet week when nobody pushes.
  #
  #   pull_request: IMPOSSIBLE, not omitted. infra/wif.tf admits only
  #     refs/heads/main; a PR run carries refs/pull/<n>/merge, so it cannot
  #     obtain a token to read any policy. This is the same constraint that
  #     keeps scripts/fetch-data.sh alive as the PR content source (STATE C25),
  #     and it is why "fold it into budget-guard" -- which runs on PRs -- could
  #     never have worked. The PR-time cover is the credential-free
  #     configuration check plus the wiring guard above.
  #
  # NO `needs:`. This job audits the LIVE project, which no job in this workflow
  # changes -- Terraform is applied by hand, not by CI. Hanging it off `build`
  # or `deploy` would mean a broken site hides an IAM exposure, and would stop
  # it running on the scheduled polls that find nothing new to build (the
  # `check` job short-circuits those, and those are most of the runs).
  #
  # IT FAILS THE JOB. check-private-bucket-iam.sh exits 1 on any failure, so
  # this job goes red, and notify-failure opens the tracking issue.
  private-bucket-live-iam:
    # Enumerated rather than `!= 'pull_request'` so a reader -- and the wiring
    # guard above -- can see that the schedule is admitted.
    #
    # Deliberately NOT conditioned on vars.GCP_AUDITOR_SA: that would turn a
    # missing variable into a silently skipped job, which is the defect this
    # whole change exists to end. The first step fails loudly instead.
    if: >-
      (github.event_name == 'schedule'
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch')
      && vars.GCP_PROJECT_ID != ''
      && vars.GCP_PRIVATE_BUCKET != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout, for infra/scripts/check-private-bucket-iam.sh
      id-token: write # the GitHub OIDC token exchanged through WIF
    steps:
      # Checkout comes first: auth writes its credentials file into the
      # workspace, and a later checkout would delete it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check the auditor identity is configured
        env:
          GCP_AUDITOR_SA: ${{ vars.GCP_AUDITOR_SA }}
        run: |
          if [ -z "${GCP_AUDITOR_SA}" ]; then
            echo "::error::vars.GCP_AUDITOR_SA is not set, so the LIVE half of the bucket IAM test cannot authenticate. Set it to the value of: terraform output -raw auditor_service_account_email (infra/README.md, Phase 3). This step FAILS rather than skipping, deliberately: a live check that is quietly not running, inside a green pipeline, is issue #58."
            exit 1
          fi
          echo "auditor identity: ${GCP_AUDITOR_SA}"

      # The READ-ONLY auditor (infra/auditor.tf), not the deploy identity.
      # hub-deploy holds object permissions only and cannot read a bucket policy
      # or the project policy; widening it for a check would widen the identity
      # that can delete every private object. hub-auditor holds exactly three
      # permissions and no storage.objects.* at all.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_AUDITOR_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # GATE_SA is derived rather than carried as a fourth repository variable:
      # "hub-gate" is a fixed local in infra/gate.tf (local.gate_service_name),
      # not a Terraform variable, precisely because firebase.json names it
      # literally. If it ever stops matching, section 2 of the script fails on
      # the equality assertion -- loudly, which is the correct outcome.
      #
      # PROBE_OBJECT runs the anonymous-request clause of the criterion, which
      # needs no credential at all. It defaults to the private build's root
      # page; override it with vars.GCP_PRIVATE_PROBE_OBJECT if that ever stops
      # being a real object. No private path is committed here.
      - name: Read the live private-bucket IAM policy and fail on any exposure
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          BUCKET: ${{ vars.GCP_PRIVATE_BUCKET }}
          HUB_SA: ${{ vars.GCP_DEPLOY_SA }}
          PROBE_OBJECT: ${{ vars.GCP_PRIVATE_PROBE_OBJECT || 'index.html' }}
        run: |
          export GATE_SA="hub-gate@${PROJECT}.iam.gserviceaccount.com"
          bash infra/scripts/check-private-bucket-iam.sh

  # Exercises firebase-deploy's locked install without any credential (delta
  # review B3). firebase-deploy is skipped on pull requests and dormant until
  # the GitHub Actions variables are set, so otherwise its install step would
  # first run at the first real deploy. Same Node version and same install
  # command as firebase-deploy. No auth step, no secrets, no id-token, and not a
  # need of the notification jobs. A firebase-tools bump changes
  # infra/deploy-tools/package.json, its lockfile and the expected version here.
  deploy-tools:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.1

      - name: Install firebase-tools from the lockfile
        run: npm ci --prefix infra/deploy-tools --no-audit --no-fund

      - name: Check the locked firebase-tools version
        run: |
          VERSION="$(infra/deploy-tools/node_modules/.bin/firebase --version)"
          echo "firebase --version: ${VERSION}"
          if [ "${VERSION}" != "15.30.1" ]; then
            echo "::error file=infra/deploy-tools/package-lock.json::firebase --version printed '${VERSION}', expected 15.30.1."
            exit 1
          fi

  # Builds and tests the GitHub Pages variant (SEAM-1, SEAM-5). This is the only
  # build the Pages deploy depends on, so the Firebase variant (build-firebase,
  # below) cannot fail or block it (SEAM-4). Pull requests stop here: nothing
  # below deploys on a pull_request event.
  # Proves the leak check still catches a leak -- on every run, today.
  #
  # The real check (in build and build-firebase) exits 0 right now while printing
  # that it proved nothing: no private item is published until phd-milestones
  # first publishes at Checkpoint 4, so there is no private slug to search for.
  # A guard that never fires is indistinguishable from one that is broken, and
  # this is the guard the entire private phase rests on (ADR-0005, SEAM-4).
  #
  # It runs in its OWN job for one reason. demo:leak-check needs private items to
  # exist, which means running content:fixture, which rewrites site/src/content.
  # Doing that inside build or build-firebase would put fixture content into the
  # artifact those jobs upload to the live site. A separate runner cannot
  # contaminate a deploy.
  #
  # It gates nothing deliberately: a broken guard surfaces as a red job rather
  # than blocking the deploy lane. Promoting it to a required check is the
  # owner's call at Checkpoint 4.
  leak-check-self-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      # The committed fixture publishes two PRIVATE items for exactly this
      # purpose. No bucket, no credential, no network.
      - name: Publish the fixture content
        run: npm run content:fixture

      # demo:leak-check copies an existing build; it does not produce one.
      - name: Build the public output
        env:
          SITE_URL: https://djjay0131.github.io
          SITE_BASE: /website/
        run: npm run build

      # Injects a private slug into a COPY of dist-public and asserts the leak
      # check FAILS on it. Exits 0 only when the guard caught the leak.
      - name: Prove the leak check catches a leak
        run: npm run demo:leak-check

      # AND the private-link guard, here rather than only in build-firebase.
      #
      # In build-firebase no private item is published yet, so the private build
      # renders ONE page -- the members' index with no item links -- and
      # check:private-links passes having inspected almost nothing. It would NOT
      # have caught issue #27, whose broken links (/phd/..., /_payload/...) only
      # exist once there are items. That is the same vacuous-guard failure the
      # leak check had, and it is why this job exists at all.
      #
      # The fixture published above carries two private items, so here the private
      # build renders five pages with real routes and real payload URLs, and the
      # guard has something to prove.
      - name: Build the private output from the fixture
        run: npm run build:private

      - name: Prove every private link resolves under the gate's base
        run: npm run check:private-links

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the GitHub OIDC token exchanged through WIF to read the bucket
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      # Checkout comes first: auth writes its credentials file into the
      # workspace, and a later checkout would delete it.
      - name: Authenticate to Google Cloud
        id: auth
        if: needs.check.outputs.use_bucket == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      # SEAM-2/SEAM-4: the one place that reads the content bucket.
      - name: Sync published content from the content bucket
        if: needs.check.outputs.use_bucket == 'true'
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONTENT_BUCKET: ${{ vars.GCP_CONTENT_BUCKET }}
        run: bash scripts/sync-content.sh --bucket "${CONTENT_BUCKET}"

      # Fallback source. Produces the same tree and the same manifest; see the
      # header. Never runs once the bucket is configured and the run can
      # authenticate.
      - name: Fetch the CV payload from the cv release
        if: needs.check.outputs.use_bucket != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-data.sh

      # Astro copies public/ verbatim into the build output, so this ships to
      # <site>/build-info.json on both hosts and becomes the state the next
      # scheduled poll compares against. jq handles the quoting.
      - name: Record build info
        env:
          CONTENT_FINGERPRINT: ${{ needs.check.outputs.content_fingerprint }}
          CV_FINGERPRINT: ${{ needs.check.outputs.cv_fingerprint }}
          CONTENT_SOURCE: ${{ needs.check.outputs.use_bucket == 'true' && 'bucket' || 'cv-release' }}
        run: |
          jq -n \
            --arg content "${CONTENT_FINGERPRINT}" \
            --arg fp "${CV_FINGERPRINT}" \
            --arg src "${CONTENT_SOURCE}" \
            --arg sha "${GITHUB_SHA}" \
            --arg run "${GITHUB_RUN_ID}" \
            '{content_fingerprint: $content, cv_fingerprint: $fp, content_source: $src, built_from_sha: $sha, run_id: $run}' \
            > public/build-info.json
          cat public/build-info.json

      - name: Run tests (GitHub Pages variant)
        env:
          SITE_URL: https://djjay0131.github.io
          SITE_BASE: /website/
        run: npm test

      # PUBLIC_FIREBASE_* is the Firebase Web app's PUBLIC client configuration,
      # not a credential -- it identifies the project to the browser and is visible
      # in any deployed page that uses Firebase Auth. It is a repository VARIABLE
      # for that reason, never a secret. With it unset, site/src/pages/signin
      # renders a plain "not configured yet" state and ships no dead sign-in
      # button, which is what the live page did until Checkpoint 4 created the web
      # app.
      - name: Build Astro (GitHub Pages variant)
        env:
          SITE_URL: https://djjay0131.github.io
          SITE_BASE: /website/
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
        run: npm run build

      # SEAM-7: fail before the upload (and so before deploy) when a smoke-test
      # route has no file in site/dist-public.
      - name: Check smoke-test routes exist (GitHub Pages variant)
        run: npm run check:smoke-routes

      # SEAM-4 / ADR-0005: the leak check runs BETWEEN build and deploy, on
      # every deploy, for BOTH hosts. GitHub Pages is still the authoritative
      # public host until Phase 6, so a private item leaking into this variant
      # is exactly as bad as one leaking into the Firebase variant.
      #
      # It greps file CONTENTS as well as paths: a private title rendered into a
      # public index page is a leak with no matching path (K11; the brief's §4
      # path-only form was insufficient and ADR-0005 overruled it).
      - name: Check no private content reached the public build (GitHub Pages variant)
        run: npm run check:no-private-in-public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist-public

  # Builds and tests the Firebase Hosting variant from the same commit, as a
  # separate job (SEAM-5), so nothing here is a new failure point for the Pages
  # path (SEAM-4). It runs on pull requests, which validate both variants and
  # upload nothing, and on the deploy path only once the owner has set
  # vars.GCP_PROJECT_ID. Until then an unconfigured push or schedule runs
  # exactly the jobs it ran before this workflow gained Firebase.
  build-firebase:
    needs: check
    if: >-
      needs.check.outputs.changed == 'true'
      && (github.event_name == 'pull_request' || vars.GCP_PROJECT_ID != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the GitHub OIDC token exchanged through WIF to read the bucket
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Authenticate to Google Cloud
        id: auth
        if: needs.check.outputs.use_bucket == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      # SEAM-2/SEAM-4: the one place that reads the content bucket.
      - name: Sync published content from the content bucket
        if: needs.check.outputs.use_bucket == 'true'
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONTENT_BUCKET: ${{ vars.GCP_CONTENT_BUCKET }}
        run: bash scripts/sync-content.sh --bucket "${CONTENT_BUCKET}"

      - name: Fetch the CV payload from the cv release
        if: needs.check.outputs.use_bucket != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-data.sh

      # Same build-info.json as the Pages build: the fingerprints come from the
      # check job, the SHA and run id from this run.
      - name: Record build info
        env:
          CONTENT_FINGERPRINT: ${{ needs.check.outputs.content_fingerprint }}
          CV_FINGERPRINT: ${{ needs.check.outputs.cv_fingerprint }}
          CONTENT_SOURCE: ${{ needs.check.outputs.use_bucket == 'true' && 'bucket' || 'cv-release' }}
        run: |
          jq -n \
            --arg content "${CONTENT_FINGERPRINT}" \
            --arg fp "${CV_FINGERPRINT}" \
            --arg src "${CONTENT_SOURCE}" \
            --arg sha "${GITHUB_SHA}" \
            --arg run "${GITHUB_RUN_ID}" \
            '{content_fingerprint: $content, cv_fingerprint: $fp, content_source: $src, built_from_sha: $sha, run_id: $run}' \
            > public/build-info.json
          cat public/build-info.json

      # SEAM-1 defaults (https://jason.cusati.us, base /), so SITE_URL and SITE_BASE
      # are deliberately unset.
      - name: Run tests (Firebase Hosting variant)
        run: npm test

      - name: Build Astro (Firebase Hosting variant)
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
        run: npm run build

      # SEAM-7: fail before any upload when a smoke-test route has no file in
      # site/dist-public.
      - name: Check smoke-test routes exist (Firebase Hosting variant)
        run: npm run check:smoke-routes

      # THE SECOND OUTPUT (ADR-0005 decision 1). Same source tree, same synced
      # content, same validated manifests; HUB_OUTPUT=private selects
      # site/dist-private and a different srcDir, so the private routes exist
      # only here and the public build above cannot emit them.
      #
      # It runs BEFORE the leak check on purpose: if the private build fails,
      # nothing is deployed and nothing is synced, which is ADR-0010 decision 3.
      - name: Build Astro (private output)
        run: npm run build:private

      # ISSUE #27. The gate serves this output under /p/** and strips /p/ to form
      # the object name, so a link that does not start with /p/ reaches the PUBLIC
      # origin and 404s for a signed-in member -- with the build, the sync and the
      # gate each individually correct and nothing erroring anywhere. It also checks
      # each link points at a file that EXISTS, because uniformly prefixed but wrong
      # is just as broken as unprefixed.
      - name: Check every private link resolves under the gate's base
        run: npm run check:private-links

      # SEAM-4 / ADR-0005: between build and deploy, on every deploy. Both
      # outputs now exist, so this is the moment the public one can be checked
      # against the full set of private items the private one rendered.
      - name: Check no private content reached the public build
        run: npm run check:no-private-in-public

      # Only the deploy path consumes the artifacts; a pull request stores none.
      - name: Upload Firebase Hosting artifact
        if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-hosting
          path: site/dist-public
          if-no-files-found: error
          retention-days: 1

      # The private output travels to the sync job as its own artifact. It
      # includes .hub-private-build.json, the build receipt the sync refuses to
      # run without -- so "the build succeeded and the manifests validated"
      # arrives as evidence rather than as an assumption (ADR-0010 decision 3).
      - name: Upload private output
        if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub-private
          path: site/dist-private
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    permissions:
      pages: write # to create the Pages deployment
      id-token: write # deploy-pages verifies the deployment's origin with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke-test:
    needs: deploy
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    permissions: {}
    steps:
      - name: Wait for Pages propagation
        run: sleep 30

      - name: Smoke test live routes
        run: |
          SITE="https://djjay0131.github.io/website"
          FAILED=0
          for ROUTE in "/" "/resumes/" "/cv/academic" "/cv/research-professional" "/papers/" "/pdfs/academic.pdf" "/projects/"; do
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "${SITE}${ROUTE}")
            if [ "$STATUS" = "200" ]; then
              echo "OK: ${ROUTE} → ${STATUS}"
            else
              echo "FAIL: ${ROUTE} → ${STATUS}"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more smoke tests failed."
            exit 1
          fi

      - name: Verify non-empty body on key routes
        run: |
          SITE="https://djjay0131.github.io/website"
          for ROUTE in "/cv/academic" "/papers/"; do
            BODY_SIZE=$(curl -sL "${SITE}${ROUTE}" | wc -c)
            if [ "$BODY_SIZE" -lt 500 ]; then
              echo "::error::${ROUTE} returned suspiciously small body (${BODY_SIZE} bytes)"
              exit 1
            fi
            echo "OK: ${ROUTE} body is ${BODY_SIZE} bytes"
          done

  # Firebase Hosting deploy (SEAM-3, SEAM-4). Runs only on the deploy path and
  # only after the owner sets vars.GCP_PROJECT_ID. Authentication is Workload
  # Identity Federation: GitHub's OIDC token is exchanged for a short-lived
  # credential that impersonates the deploy service account. No key file, no
  # token secret. The WIF binding admits only refs/heads/main (infra/deploy.tf).
  firebase-deploy:
    needs: build-firebase
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    permissions:
      contents: read # checkout, for firebase.json
      id-token: write # the GitHub OIDC token exchanged through WIF
    steps:
      - name: Check deploy configuration
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          MISSING=0
          for NAME in GCP_WIF_PROVIDER GCP_DEPLOY_SA; do
            if [ -z "${!NAME}" ]; then
              echo "::error::GCP_PROJECT_ID is set but the GitHub Actions variable ${NAME} is not (see infra/README.md)."
              MISSING=1
            fi
          done
          exit "${MISSING}"

      # Checkout comes before auth: auth writes its credentials file into the
      # workspace, and a later checkout would delete it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download Firebase Hosting build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firebase-hosting
          path: site/dist-public

      # Exact Node version. Node 22.23.0 shipped an http.Agent keep-alive
      # regression that breaks google-auth-library's STS token exchange and so
      # WIF deploys (firebase/firebase-tools#10716, nodejs/node#63989; fixed in
      # 22.23.1). An exact pin avoids it without floating the deploy runtime:
      # the version changes only by a reviewed commit. (The build jobs keep
      # node-version: 22; the token they hold reads one bucket and cannot write.)
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.1

      # firebase-tools and its whole dependency tree come from the committed
      # lockfile (infra/deploy-tools), installed before any credential exists in
      # this job. Bump through a reviewed lockfile change.
      - name: Install firebase-tools from the lockfile
        run: npm ci --prefix infra/deploy-tools --no-audit --no-fund

      # Writes an external_account credentials file (service account
      # impersonation) and exports GOOGLE_APPLICATION_CREDENTIALS, which
      # firebase-tools reads through google-auth-library's GoogleAuth
      # (firebase-tools src/requireAuth.ts, autoAuth).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # The locked firebase-tools (15.30.1, infra/deploy-tools/package-lock.json).
      - name: Deploy to Firebase Hosting
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          infra/deploy-tools/node_modules/.bin/firebase deploy \
            --only hosting \
            --project "${GCP_PROJECT_ID}" \
            --non-interactive \
            --message "${GITHUB_SHA} (run ${GITHUB_RUN_ID})"

  # THE DESTRUCTIVE PRIVATE SYNC (ADR-0010 decision 5; SEAM-5).
  #
  # Pushes site/dist-private to the private bucket and DELETES objects the
  # current build did not produce, so a withdrawn private item stops being
  # READABLE rather than merely stopping being linked. dist-public gets that for
  # free because it is redeployed wholesale; the private side is a sync, and a
  # sync that only adds leaves a withdrawn dossier served at its old path to
  # every member.
  #
  # THIS IS THE ONE JOB IN THIS WORKFLOW THAT CAN DESTROY DATA. Four things gate
  # it, and they are deliberately layered so no single mistake is sufficient:
  #
  #   1. `needs: build-firebase` — it cannot start unless the content synced,
  #      every manifest validated, the expected-source check passed, BOTH builds
  #      succeeded and the leak check passed. That is ADR-0010 decision 3 at the
  #      workflow level.
  #   2. The build receipt inside the artifact — scripts/sync-private.mjs refuses
  #      to delete anything without it, and it is written only at the very end of
  #      a successful private build. That is the same gate at the script level,
  #      and it survives someone re-ordering these steps.
  #   3. The deploy path only. Never on a pull request, and only once the owner
  #      has set both variables.
  #   4. A deletion ceiling inside the script: a sync that would remove most of
  #      the destination stops and asks for a human.
  #
  # It deliberately does NOT depend on firebase-deploy: the public host and the
  # private bucket are separate targets, and a Hosting failure is no reason to
  # leave withdrawn private content readable.
  private-sync:
    needs: build-firebase
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'pull_request'
      && vars.GCP_PROJECT_ID != ''
      && vars.GCP_PRIVATE_BUCKET != ''
    permissions:
      contents: read # checkout, for site/scripts/sync-private.mjs
      id-token: write # the GitHub OIDC token exchanged through WIF
    steps:
      # Checkout comes before auth: auth writes its credentials file into the
      # workspace, and a later checkout would delete it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # include-hidden-files was set on the upload so .hub-private-build.json
      # travels. Without the receipt this job refuses to run at all, which is the
      # intended behaviour rather than a hazard.
      - name: Download the private output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hub-private
          path: site/dist-private

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      # Always printed, so every deletion this run intends is in the log BEFORE
      # anything is removed, whether or not the apply step then succeeds.
      - name: Plan the private sync (dry run)
        working-directory: site
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PRIVATE_BUCKET: ${{ vars.GCP_PRIVATE_BUCKET }}
        run: node scripts/sync-private.mjs --bucket "${PRIVATE_BUCKET}"

      # THE KILL SWITCH, and the only way the Part C withdrawal proof can be
      # performed at all.
      #
      # The plan step above and this one used to be consecutive with nothing
      # between them, so the deletion happened before anyone could read the
      # enumerated delete list. That made the Chief Reviewer's Part C
      # impossible as written -- "confirm the next dry run names exactly that
      # item's objects and no others BEFORE the apply step runs" -- because by
      # the time the plan was readable the objects were already gone. Nothing
      # else in this job is a gate: the `environment:` key further down this
      # file belongs to the GitHub Pages `deploy` job, not to private-sync, and
      # must not be mistaken for protection that already exists.
      #
      # DEFAULT IS APPLY-ENABLED, deliberately. vars.PRIVATE_SYNC_PLAN_ONLY is
      # unset in normal operation, and an unset variable makes this condition
      # '' != 'true', which is TRUE -- so the sync runs exactly as before. A
      # condition that failed closed here would silently stop the private area
      # updating, and withdrawn content would keep being served: a worse
      # failure than the one this prevents.
      #
      # To run plan-only: set the repository variable PRIVATE_SYNC_PLAN_ONLY to
      # the string 'true', run the workflow, read the delete list the step
      # above enumerates, then unset it and run again. No code change, which
      # also makes this the kill switch for the single most dangerous mechanism
      # in the system -- ADR-0010's own Risks call the destructive sync "the one
      # place in this system where a build defect can remove data".
      - name: Sync the private output, pruning what this build did not produce
        if: vars.PRIVATE_SYNC_PLAN_ONLY != 'true'
        working-directory: site
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PRIVATE_BUCKET: ${{ vars.GCP_PRIVATE_BUCKET }}
        run: node scripts/sync-private.mjs --bucket "${PRIVATE_BUCKET}" --apply

      # Makes a plan-only run say so in the job log, rather than looking like a
      # sync that quietly did nothing.
      - name: Report that this was a plan-only run
        if: vars.PRIVATE_SYNC_PLAN_ONLY == 'true'
        run: |
          echo "::notice::PRIVATE_SYNC_PLAN_ONLY is 'true', so the destructive sync was SKIPPED. The delete list enumerated by the dry run above was not applied. Unset the repository variable and re-run to apply it."

  # Same routes and body-size checks as the Pages smoke test, against the
  # Firebase host at base path "/".
  firebase-smoke-test:
    needs: firebase-deploy
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    permissions: {}
    steps:
      - name: Resolve the Firebase site URL
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          SITE="${SITE_URL:-https://${GCP_PROJECT_ID}.web.app}"
          echo "SITE=${SITE%/}" >> "$GITHUB_ENV"
          echo "Smoke testing ${SITE%/}"

      - name: Wait for Hosting propagation
        run: sleep 15

      - name: Smoke test live routes
        run: |
          FAILED=0
          for ROUTE in "/" "/resumes/" "/cv/academic" "/cv/research-professional" "/papers/" "/pdfs/academic.pdf" "/projects/"; do
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "${SITE}${ROUTE}")
            if [ "$STATUS" = "200" ]; then
              echo "OK: ${ROUTE} → ${STATUS}"
            else
              echo "FAIL: ${ROUTE} → ${STATUS}"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more Firebase smoke tests failed."
            exit 1
          fi

      - name: Verify non-empty body on key routes
        run: |
          for ROUTE in "/cv/academic" "/papers/"; do
            BODY_SIZE=$(curl -sL "${SITE}${ROUTE}" | wc -c)
            if [ "$BODY_SIZE" -lt 500 ]; then
              echo "::error::${ROUTE} returned suspiciously small body (${BODY_SIZE} bytes)"
              exit 1
            fi
            echo "OK: ${ROUTE} body is ${BODY_SIZE} bytes"
          done

  # Single place that reports failures anywhere in the pipeline. The webhook is
  # optional; the tracking issue is not, so a broken build is visible (and
  # emailed by GitHub) even with no secrets configured at all. Without this,
  # nothing surfaced ~190 consecutive scheduled failures over 8 days.
  notify-failure:
    needs: [check, budget-guard, build, deploy, smoke-test, build-firebase, firebase-deploy, firebase-smoke-test, private-sync, private-bucket-live-iam]
    runs-on: ubuntu-24.04
    # A failed PR check already shows up on the PR itself; only page out for
    # failures on the real deploy path.
    if: failure() && github.event_name != 'pull_request'
    permissions:
      issues: write # label, list, comment on and open the tracking issue
    steps:
      - name: Send webhook notification
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK }}
        run: |
          if [ -n "${WEBHOOK_URL}" ]; then
            curl -sSf -X POST "${WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"Website build/deploy failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          else
            echo "No NOTIFICATION_WEBHOOK configured; relying on the tracking issue."
          fi

      - name: Open or update the failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create ci-failure \
            --color B60205 \
            --description "Automated build/deploy failure" \
            --force >/dev/null

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EXISTING=$(gh issue list --label ci-failure --state open --limit 1 \
            --json number --jq '.[0].number // ""')

          # One issue per outage, not one per hourly run -- comment on the open
          # one instead of filing a new one every hour.
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" \
              --body "Still failing as of ${GITHUB_EVENT_NAME} run: ${RUN_URL}"
            echo "Commented on existing issue #${EXISTING}."
          else
            gh issue create \
              --title "build-and-deploy is failing" \
              --label ci-failure \
              --body "$(printf '%s\n' \
                "The \`build-and-deploy\` workflow failed." \
                "" \
                "- Run: ${RUN_URL}" \
                "- Trigger: ${GITHUB_EVENT_NAME}" \
                "- Commit: ${GITHUB_SHA}" \
                "" \
                "This issue is opened automatically and closes on the next fully successful run.")"
          fi

  # Closes the tracking issue once the pipeline is healthy again. It needs a
  # successful Pages smoke test (so no-op scheduled runs, where build is
  # skipped, do not count) and no failed job anywhere. The Firebase jobs may be
  # skipped -- they are until the owner configures them -- but not failed.
  notify-recovery:
    needs: [check, budget-guard, build, deploy, smoke-test, build-firebase, firebase-deploy, firebase-smoke-test, private-sync, private-bucket-live-iam]
    runs-on: ubuntu-24.04
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.smoke-test.result == 'success'
      && !contains(needs.*.result, 'failure')
    permissions:
      issues: write # list and close the tracking issue
    steps:
      - name: Close the failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for N in $(gh issue list --label ci-failure --state open --json number --jq '.[].number'); do
            gh issue close "${N}" --comment "Recovered: ${RUN_URL}"
            echo "Closed #${N}."
          done
