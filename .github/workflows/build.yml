name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# No workflow-wide grant. Each job asks for exactly what it uses.
permissions: {}

# Real deploys (push/schedule/manual) stay serialized under a single "pages"
# group so they never race each other. PR validation builds get their own
# per-branch group -- they never deploy, so they must not queue behind (or hold
# up) the deploy lane, and a new push to a PR supersedes the run in flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two hosts are built from every commit until Phase 6 (ADR-0001 Decision 4;
# phase-1-seams.md SEAM-5):
#   - GitHub Pages at https://djjay0131.github.io/website/ -- live and
#     authoritative, deployed exactly as before;
#   - Firebase Hosting -- deployed only once the owner sets the GitHub Actions
#     variable GCP_PROJECT_ID (with GCP_WIF_PROVIDER and GCP_DEPLOY_SA, the
#     outputs of infra/). Until then the Firebase jobs are skipped.
#
# PHASE 2 (ADR-0007, ADR-0008; phase-2-seams.md SEAM-4, SEAM-5). The hub no
# longer learns of a publish by being told: `repository_dispatch: [cv-updated]`
# is GONE, because any credential able to fire it at this repository could also
# write to it. Satellites publish to the content bucket and hold no GitHub
# credential for `website`; the hub polls the bucket on the hourly schedule,
# fingerprints it, and rebuilds when the fingerprint differs from the deployed
# build. `workflow_dispatch` remains the owner's escape hatch for "publish this
# now", and needs no satellite credential at all: a manual run always builds.
#
# WHERE THE CV DATA COMES FROM, per trigger. Every trigger has a source; no
# build on any trigger produces a site without the CV, because GitHub Pages is
# authoritative until Phase 6 and serves live CV links.
#
#   push / schedule / workflow_dispatch, once vars.GCP_CONTENT_BUCKET is set
#       -> scripts/sync-content.sh --bucket : the content bucket. The contract
#          path, and the only one after Checkpoint 3 on the deploy lane.
#   pull_request
#       -> scripts/fetch-data.sh : the cv GitHub release. A PR run carries
#          refs/pull/<n>/merge and the deploy binding admits only
#          refs/heads/main (infra/wif.tf), so it CANNOT authenticate to read the
#          bucket. Without this fallback every PR would build a CV-less site and
#          fail check:smoke-routes on /cv/academic.
#   any trigger while vars.GCP_CONTENT_BUCKET is unset
#       -> scripts/fetch-data.sh : covers the window between merging Phase 2 and
#          the owner applying Terraform and setting the variable at Checkpoint 3.
#
# Both sources produce the SAME bucket-shaped tree under
# site/src/content/sources/ and the same manifest, so everything downstream --
# manifest validation in site/src/content.config.ts, the data-item claim check,
# public-asset staging, the CV pages -- is identical either way. Only the
# transport differs. The fallback is retired when the bucket path is proven;
# see the Phase 2 site handoff.
#
# Actions are pinned by full commit SHA with the version in a comment, as in
# ci.yml, so a retagged action cannot change this pipeline without a commit.

jobs:
  # The poll (ADR-0007 decision 1; SEAM-4). This site has no CV content of its
  # own. The hourly schedule exists to notice a publish, but almost every poll
  # finds nothing new and would rebuild identical bytes. Fingerprint the source
  # and compare against the fingerprint recorded in the currently deployed
  # build; skip the pipeline when they match.
  #
  # HOW DELETIONS ARE COVERED. The bucket fingerprint is a SHA-256 over the
  # sorted listing of EVERY object under sources/ -- one line per object,
  # "<name> <generation> <size>" (scripts/sync-content.sh). Deleting an object
  # removes its line, so the hash changes just as surely as adding or replacing
  # one does. This is deliberate: a fingerprint built from "the newest object"
  # or "the latest published timestamp" would NOT change when an item is
  # withdrawn, and a withdrawn item that leaves the site looking unchanged is a
  # defect (ADR-0007 Risks: "a fingerprint that misses deletions would leave
  # withdrawn content on the site").
  #
  # Only scheduled polls are eligible to skip. Pushes, PRs and manual runs
  # always build -- they imply the inputs or the site code changed, which the
  # fingerprint alone would not catch, and workflow_dispatch is the owner's
  # "publish now" escape hatch.
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout, for scripts/sync-content.sh
      id-token: write # the GitHub OIDC token exchanged through WIF (ADR-0007 decision 7)
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      use_bucket: ${{ steps.final.outputs.use_bucket }}
      content_fingerprint: ${{ steps.compare.outputs.content_fingerprint }}
      cv_fingerprint: ${{ steps.compare.outputs.cv_fingerprint }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # One decision, made once and reused by every job below, so the poll and
      # the builds can never disagree about where the content came from.
      - name: Decide which CV data source this run uses
        id: mode
        env:
          CONTENT_BUCKET: ${{ vars.GCP_CONTENT_BUCKET }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          USE_BUCKET=true
          REASON=""
          if [ -z "${CONTENT_BUCKET}" ]; then
            USE_BUCKET=false
            REASON="vars.GCP_CONTENT_BUCKET is not set (Checkpoint 3 has not been run yet)"
          elif [ -z "${GCP_PROJECT_ID}" ] || [ -z "${GCP_WIF_PROVIDER}" ] || [ -z "${GCP_DEPLOY_SA}" ]; then
            USE_BUCKET=false
            REASON="GCP_CONTENT_BUCKET is set but GCP_PROJECT_ID, GCP_WIF_PROVIDER or GCP_DEPLOY_SA is not (see infra/README.md)"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            USE_BUCKET=false
            REASON="a pull_request run carries refs/pull/<n>/merge, and the deploy binding admits only refs/heads/main (infra/wif.tf), so it cannot read the bucket"
          fi
          echo "use_bucket=${USE_BUCKET}" >> "$GITHUB_OUTPUT"
          if [ "${USE_BUCKET}" = "true" ]; then
            echo "::notice::CV data source: the content bucket (the Phase 2 contract path)."
          else
            echo "::notice::CV data source: the cv GitHub release (fallback) -- ${REASON}."
          fi

      # Writes an external_account credentials file and exports
      # GOOGLE_APPLICATION_CREDENTIALS; token_format: access_token additionally
      # mints the OAuth token the sync script uses directly. A scheduled run
      # carries ref refs/heads/main, so the existing binding admits it and no
      # new binding is needed (ADR-0007 decision 7).
      - name: Authenticate to Google Cloud
        id: auth
        if: steps.mode.outputs.use_bucket == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      # Two object operations and nothing else: objects.list to enumerate, and
      # (in the build jobs) objects.get to download. The hub's grant is
      # roles/storage.objectViewer on the bucket, which does NOT include
      # storage.buckets.get, so nothing here reads bucket metadata.
      - name: Fingerprint the content bucket
        id: bucket
        if: steps.mode.outputs.use_bucket == 'true'
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONTENT_BUCKET: ${{ vars.GCP_CONTENT_BUCKET }}
        run: |
          FP="$(site/scripts/sync-content.sh --fingerprint --bucket "${CONTENT_BUCKET}")"
          echo "content_fingerprint=${FP}" >> "$GITHUB_OUTPUT"
          echo "content fingerprint: ${FP}"

      # An empty bucket is a real state, not a fault: it is how the system looks
      # before any satellite has ever published. sync-content.sh gives it the
      # stable fingerprint "empty" for exactly this purpose.
      #
      # Falling back here is what keeps `main` buildable between the moment
      # Checkpoint 3 sets GCP_CONTENT_BUCKET and the moment the first satellite
      # publishes. Without it the hub syncs nothing, and every job downstream
      # fails on a tree that was never populated (issue #19).
      #
      # This does NOT weaken the rule that a source which HAS published and then
      # lost its manifest fails the build. Those are different states and stay
      # distinguishable: "empty" means the bucket holds no objects at all, while
      # a vanished manifest leaves objects behind and still fails in the sync.
      - name: Fall back when the bucket holds no published content yet
        id: final
        env:
          PROVISIONAL: ${{ steps.mode.outputs.use_bucket }}
          CONTENT_FINGERPRINT: ${{ steps.bucket.outputs.content_fingerprint }}
        run: |
          USE_BUCKET="${PROVISIONAL}"
          if [ "${PROVISIONAL}" = "true" ] && [ "${CONTENT_FINGERPRINT}" = "empty" ]; then
            USE_BUCKET=false
            echo "::notice::CV data source: the cv GitHub release (fallback) -- the content bucket is reachable but no satellite has published to it yet. This is the expected state until cv publishes for the first time."
          fi
          echo "use_bucket=${USE_BUCKET}" >> "$GITHUB_OUTPUT"

      - name: Fingerprint the cv release
        id: release
        if: steps.final.outputs.use_bucket != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FP=$(gh release view latest --repo djjay0131/cv --json assets \
            --jq '[.assets[] | "\(.name):\(.updatedAt)"] | sort | join(",")')
          echo "cv_fingerprint=${FP}" >> "$GITHUB_OUTPUT"
          echo "cv release fingerprint: ${FP}"

      - name: Compare against the deployed build
        id: compare
        env:
          EVENT_NAME: ${{ github.event_name }}
          USE_BUCKET: ${{ steps.final.outputs.use_bucket }}
          CONTENT_FINGERPRINT: ${{ steps.bucket.outputs.content_fingerprint }}
          CV_FINGERPRINT: ${{ steps.release.outputs.cv_fingerprint }}
          # SEAM-5: read the deployed build info from SITE_URL when the owner has
          # set it, else from GitHub Pages.
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          echo "content_fingerprint=${CONTENT_FINGERPRINT}" >> "$GITHUB_OUTPUT"
          echo "cv_fingerprint=${CV_FINGERPRINT}" >> "$GITHUB_OUTPUT"

          if [ "${USE_BUCKET}" = "true" ]; then
            FIELD="content_fingerprint"
            CURRENT="${CONTENT_FINGERPRINT}"
          else
            FIELD="cv_fingerprint"
            CURRENT="${CV_FINGERPRINT}"
          fi

          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "${EVENT_NAME} run -- building unconditionally."
            exit 0
          fi

          DEPLOYED_SITE="${SITE_URL:-https://djjay0131.github.io/website}"
          DEPLOYED_SITE="${DEPLOYED_SITE%/}"
          echo "reading deployed build info from ${DEPLOYED_SITE}/build-info.json"

          # A missing or unreadable build-info.json (first run after this
          # lands, or a failed deploy) falls through to "changed" and builds.
          # So does a deployed build recorded against the OTHER source: after
          # Checkpoint 3 the first scheduled poll finds no content_fingerprint
          # and rebuilds once, which is correct.
          DEPLOYED=$(curl -sfL "${DEPLOYED_SITE}/build-info.json" \
            | jq -r ".${FIELD} // \"\"" 2>/dev/null || true)
          echo "deployed ${FIELD}: ${DEPLOYED:-<none>}"

          if [ -n "${DEPLOYED}" ] && [ "${DEPLOYED}" = "${CURRENT}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::published content unchanged since the deployed build; skipping build and deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Budget presence check (design doc §12.6: the budget alert is never removed).
  # prevent_destroy in infra/budget.tf stops a destroy only while the resource
  # block is in the configuration; deleting the block or the file would destroy
  # the budget in one apply. Terraform override files (override.tf*,
  # *_override.tf*) merge into resource blocks, lifecycle argument by argument,
  # so a tracked override could switch the guard off while budget.tf is
  # unchanged. This job fails on either, before any apply.
  #
  # It runs on EVERY trigger, independently of vars.GCP_PROJECT_ID, and deploys
  # nothing. Both notification jobs need it: a skipped run would let
  # notify-recovery close the tracking issue while main still lacks the guard
  # (delta review B1). Comments are stripped first, so a commented-out block or
  # guard does not pass; whitespace is free.
  budget-guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check no Terraform override file is tracked under infra/
        run: |
          TRACKED_FILES="$(git -c core.quotePath=false ls-files -- infra)"
          FOUND=0
          while IFS= read -r TRACKED; do
            case "$(basename -- "${TRACKED:-.}")" in
              override.tf* | *_override.tf*)
                echo "::error file=${TRACKED}::${TRACKED} is a Terraform override file. Overrides merge into resource blocks, lifecycle argument by argument, and can disable prevent_destroy on the budget. None may be tracked under infra/."
                FOUND=1
                ;;
            esac
          done <<< "${TRACKED_FILES}"
          if [ "${FOUND}" -eq 0 ]; then
            echo "OK: no override.tf* or *_override.tf* file is tracked under infra/."
          fi
          exit "${FOUND}"

      # Runs even if the override check failed, so both problems are reported.
      - name: Check the budget and its prevent_destroy guard are declared
        if: ${{ !cancelled() }}
        env:
          FILE: infra/budget.tf
        run: |
          if [ ! -f "${FILE}" ]; then
            echo "::error file=${FILE}::${FILE} is missing. The \$5 budget is never removed (design doc §12.6)."
            exit 1
          fi
          set +e
          perl -0777 -ne '
            s{/\*.*?\*/}{}gs;
            s{(?:#|//)[^\n]*}{}g;
            unless (/\bresource\s+"?google_billing_budget"?\s+"?hub"?\s*(\{(?:[^{}]++|(?1))*\})/) { exit 2 }
            my $block = $1;
            unless ($block =~ /\blifecycle\s*(\{(?:[^{}]++|(?1))*\})/ && $1 =~ /\bprevent_destroy\s*=\s*true\b/) { exit 3 }
          ' "${FILE}"
          RC=$?
          set -e
          case "${RC}" in
            0) echo "OK: ${FILE} declares google_billing_budget.hub with prevent_destroy = true." ;;
            2) echo "::error file=${FILE}::${FILE} does not declare resource \"google_billing_budget\" \"hub\". The \$5 budget is never removed (design doc §12.6)."; exit 1 ;;
            3) echo "::error file=${FILE}::google_billing_budget.hub in ${FILE} has no lifecycle { prevent_destroy = true }."; exit 1 ;;
            *) echo "::error file=${FILE}::budget check could not run (perl exit ${RC})."; exit 1 ;;
          esac

      # Chief Reviewer S6. Every tracked *.sh beginning with a shebang must be
      # committed executable. This repository is developed on a DrvFs mount that
      # reports every file as 0777, so a 100644 script runs perfectly locally and
      # fails on the runner with exit 126 -- which is exactly how sync-content.sh
      # broke this workflow. The rule asks how a file declares itself, not how its
      # path is spelled, so it has no false-positive class: a spelling-based scan
      # produced twelve false hits against one real defect, and a noisy guard gets
      # switched off.
      - name: Check every shebang script is committed executable
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import subprocess, sys
          out = subprocess.run(["git", "ls-tree", "-r", "HEAD"],
                               capture_output=True, text=True, check=True).stdout
          bad = []
          for line in out.splitlines():
              meta, path = line.split("\t", 1)
              mode = meta.split()[0]
              if not path.endswith(".sh"):
                  continue
              try:
                  with open(path, "rb") as fh:
                      if fh.read(2) != b"#!":
                          continue
              except OSError:
                  continue
              if mode != "100755":
                  bad.append((mode, path))
          for mode, path in bad:
              print(f"::error file={path}::{path} begins with a shebang but is committed "
                    f"{mode}. Invoking it directly fails on Linux with exit 126. "
                    f"Fix: git update-index --chmod=+x {path}")
          if bad:
              sys.exit(1)
          print("OK: every shebang-bearing *.sh is committed 100755.")
          PY

      # Chief Reviewer S5, and the infra stream's own recommendation. These are the
      # two invariants that fail OPEN rather than loudly:
      #   - without uniform bucket-level access an IAM condition does not apply at
      #     all, so every satellite's prefix binding silently widens to the whole
      #     bucket, with nothing anywhere looking different;
      #   - storage.objects.list cannot be restricted by prefix, so a satellite
      #     granted it could enumerate every other source's object names -- in
      #     Phase 3, the private ones.
      # Neither produces an error, which is why they are asserted here rather than
      # trusted to review. Same reasoning as the budget check above.
      - name: Check the satellite boundary invariants are declared
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import re, sys
          fail = False

          storage = re.sub(r"#[^\n]*", "", open("infra/storage.tf", encoding="utf-8").read())
          if not re.search(r"\buniform_bucket_level_access\s*=\s*true\b", storage):
              print("::error file=infra/storage.tf::google_storage_bucket.content must set "
                    "uniform_bucket_level_access = true. Without it no IAM condition applies, "
                    "and every satellite prefix binding covers the whole bucket "
                    "(ADR-0007 decision 8).")
              fail = True

          role = re.sub(r"#[^\n]*", "", open("infra/satellite-role.tf", encoding="utf-8").read())
          block = re.search(r"permissions\s*=\s*\[(.*?)\]", role, re.S)
          perms = sorted(re.findall(r'"([^"]+)"', block.group(1))) if block else []
          want = ["storage.objects.create", "storage.objects.delete", "storage.objects.get"]
          if perms != want:
              print(f"::error file=infra/satellite-role.tf::satellite_publisher must grant "
                    f"exactly {want} -- got {perms}. storage.objects.list in particular cannot "
                    f"be restricted to a prefix (ADR-0007 decision 4).")
              fail = True

          if fail:
              sys.exit(1)
          print("OK: UBLA declared, and the satellite role holds exactly its three permissions.")
          PY


  # Exercises firebase-deploy's locked install without any credential (delta
  # review B3). firebase-deploy is skipped on pull requests and dormant until
  # the GitHub Actions variables are set, so otherwise its install step would
  # first run at the first real deploy. Same Node version and same install
  # command as firebase-deploy. No auth step, no secrets, no id-token, and not a
  # need of the notification jobs. A firebase-tools bump changes
  # infra/deploy-tools/package.json, its lockfile and the expected version here.
  deploy-tools:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.1

      - name: Install firebase-tools from the lockfile
        run: npm ci --prefix infra/deploy-tools --no-audit --no-fund

      - name: Check the locked firebase-tools version
        run: |
          VERSION="$(infra/deploy-tools/node_modules/.bin/firebase --version)"
          echo "firebase --version: ${VERSION}"
          if [ "${VERSION}" != "15.30.1" ]; then
            echo "::error file=infra/deploy-tools/package-lock.json::firebase --version printed '${VERSION}', expected 15.30.1."
            exit 1
          fi

  # Builds and tests the GitHub Pages variant (SEAM-1, SEAM-5). This is the only
  # build the Pages deploy depends on, so the Firebase variant (build-firebase,
  # below) cannot fail or block it (SEAM-4). Pull requests stop here: nothing
  # below deploys on a pull_request event.
  # Proves the leak check still catches a leak -- on every run, today.
  #
  # The real check (in build and build-firebase) exits 0 right now while printing
  # that it proved nothing: no private item is published until phd-milestones
  # first publishes at Checkpoint 4, so there is no private slug to search for.
  # A guard that never fires is indistinguishable from one that is broken, and
  # this is the guard the entire private phase rests on (ADR-0005, SEAM-4).
  #
  # It runs in its OWN job for one reason. demo:leak-check needs private items to
  # exist, which means running content:fixture, which rewrites site/src/content.
  # Doing that inside build or build-firebase would put fixture content into the
  # artifact those jobs upload to the live site. A separate runner cannot
  # contaminate a deploy.
  #
  # It gates nothing deliberately: a broken guard surfaces as a red job rather
  # than blocking the deploy lane. Promoting it to a required check is the
  # owner's call at Checkpoint 4.
  leak-check-self-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      # The committed fixture publishes two PRIVATE items for exactly this
      # purpose. No bucket, no credential, no network.
      - name: Publish the fixture content
        run: npm run content:fixture

      # demo:leak-check copies an existing build; it does not produce one.
      - name: Build the public output
        env:
          SITE_URL: https://djjay0131.github.io
          SITE_BASE: /website/
        run: npm run build

      # Injects a private slug into a COPY of dist-public and asserts the leak
      # check FAILS on it. Exits 0 only when the guard caught the leak.
      - name: Prove the leak check catches a leak
        run: npm run demo:leak-check

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the GitHub OIDC token exchanged through WIF to read the bucket
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      # Checkout comes first: auth writes its credentials file into the
      # workspace, and a later checkout would delete it.
      - name: Authenticate to Google Cloud
        id: auth
        if: needs.check.outputs.use_bucket == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      # SEAM-2/SEAM-4: the one place that reads the content bucket.
      - name: Sync published content from the content bucket
        if: needs.check.outputs.use_bucket == 'true'
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONTENT_BUCKET: ${{ vars.GCP_CONTENT_BUCKET }}
        run: bash scripts/sync-content.sh --bucket "${CONTENT_BUCKET}"

      # Fallback source. Produces the same tree and the same manifest; see the
      # header. Never runs once the bucket is configured and the run can
      # authenticate.
      - name: Fetch the CV payload from the cv release
        if: needs.check.outputs.use_bucket != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-data.sh

      # Astro copies public/ verbatim into the build output, so this ships to
      # <site>/build-info.json on both hosts and becomes the state the next
      # scheduled poll compares against. jq handles the quoting.
      - name: Record build info
        env:
          CONTENT_FINGERPRINT: ${{ needs.check.outputs.content_fingerprint }}
          CV_FINGERPRINT: ${{ needs.check.outputs.cv_fingerprint }}
          CONTENT_SOURCE: ${{ needs.check.outputs.use_bucket == 'true' && 'bucket' || 'cv-release' }}
        run: |
          jq -n \
            --arg content "${CONTENT_FINGERPRINT}" \
            --arg fp "${CV_FINGERPRINT}" \
            --arg src "${CONTENT_SOURCE}" \
            --arg sha "${GITHUB_SHA}" \
            --arg run "${GITHUB_RUN_ID}" \
            '{content_fingerprint: $content, cv_fingerprint: $fp, content_source: $src, built_from_sha: $sha, run_id: $run}' \
            > public/build-info.json
          cat public/build-info.json

      - name: Run tests (GitHub Pages variant)
        env:
          SITE_URL: https://djjay0131.github.io
          SITE_BASE: /website/
        run: npm test

      - name: Build Astro (GitHub Pages variant)
        env:
          SITE_URL: https://djjay0131.github.io
          SITE_BASE: /website/
        run: npm run build

      # SEAM-7: fail before the upload (and so before deploy) when a smoke-test
      # route has no file in site/dist-public.
      - name: Check smoke-test routes exist (GitHub Pages variant)
        run: npm run check:smoke-routes

      # SEAM-4 / ADR-0005: the leak check runs BETWEEN build and deploy, on
      # every deploy, for BOTH hosts. GitHub Pages is still the authoritative
      # public host until Phase 6, so a private item leaking into this variant
      # is exactly as bad as one leaking into the Firebase variant.
      #
      # It greps file CONTENTS as well as paths: a private title rendered into a
      # public index page is a leak with no matching path (K11; the brief's §4
      # path-only form was insufficient and ADR-0005 overruled it).
      - name: Check no private content reached the public build (GitHub Pages variant)
        run: npm run check:no-private-in-public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist-public

  # Builds and tests the Firebase Hosting variant from the same commit, as a
  # separate job (SEAM-5), so nothing here is a new failure point for the Pages
  # path (SEAM-4). It runs on pull requests, which validate both variants and
  # upload nothing, and on the deploy path only once the owner has set
  # vars.GCP_PROJECT_ID. Until then an unconfigured push or schedule runs
  # exactly the jobs it ran before this workflow gained Firebase.
  build-firebase:
    needs: check
    if: >-
      needs.check.outputs.changed == 'true'
      && (github.event_name == 'pull_request' || vars.GCP_PROJECT_ID != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the GitHub OIDC token exchanged through WIF to read the bucket
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Authenticate to Google Cloud
        id: auth
        if: needs.check.outputs.use_bucket == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      # SEAM-2/SEAM-4: the one place that reads the content bucket.
      - name: Sync published content from the content bucket
        if: needs.check.outputs.use_bucket == 'true'
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONTENT_BUCKET: ${{ vars.GCP_CONTENT_BUCKET }}
        run: bash scripts/sync-content.sh --bucket "${CONTENT_BUCKET}"

      - name: Fetch the CV payload from the cv release
        if: needs.check.outputs.use_bucket != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-data.sh

      # Same build-info.json as the Pages build: the fingerprints come from the
      # check job, the SHA and run id from this run.
      - name: Record build info
        env:
          CONTENT_FINGERPRINT: ${{ needs.check.outputs.content_fingerprint }}
          CV_FINGERPRINT: ${{ needs.check.outputs.cv_fingerprint }}
          CONTENT_SOURCE: ${{ needs.check.outputs.use_bucket == 'true' && 'bucket' || 'cv-release' }}
        run: |
          jq -n \
            --arg content "${CONTENT_FINGERPRINT}" \
            --arg fp "${CV_FINGERPRINT}" \
            --arg src "${CONTENT_SOURCE}" \
            --arg sha "${GITHUB_SHA}" \
            --arg run "${GITHUB_RUN_ID}" \
            '{content_fingerprint: $content, cv_fingerprint: $fp, content_source: $src, built_from_sha: $sha, run_id: $run}' \
            > public/build-info.json
          cat public/build-info.json

      # SEAM-1 defaults (https://jason.cusati.us, base /), so SITE_URL and SITE_BASE
      # are deliberately unset.
      - name: Run tests (Firebase Hosting variant)
        run: npm test

      - name: Build Astro (Firebase Hosting variant)
        run: npm run build

      # SEAM-7: fail before any upload when a smoke-test route has no file in
      # site/dist-public.
      - name: Check smoke-test routes exist (Firebase Hosting variant)
        run: npm run check:smoke-routes

      # THE SECOND OUTPUT (ADR-0005 decision 1). Same source tree, same synced
      # content, same validated manifests; HUB_OUTPUT=private selects
      # site/dist-private and a different srcDir, so the private routes exist
      # only here and the public build above cannot emit them.
      #
      # It runs BEFORE the leak check on purpose: if the private build fails,
      # nothing is deployed and nothing is synced, which is ADR-0010 decision 3.
      - name: Build Astro (private output)
        run: npm run build:private

      # SEAM-4 / ADR-0005: between build and deploy, on every deploy. Both
      # outputs now exist, so this is the moment the public one can be checked
      # against the full set of private items the private one rendered.
      - name: Check no private content reached the public build
        run: npm run check:no-private-in-public

      # Only the deploy path consumes the artifacts; a pull request stores none.
      - name: Upload Firebase Hosting artifact
        if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-hosting
          path: site/dist-public
          if-no-files-found: error
          retention-days: 1

      # The private output travels to the sync job as its own artifact. It
      # includes .hub-private-build.json, the build receipt the sync refuses to
      # run without -- so "the build succeeded and the manifests validated"
      # arrives as evidence rather than as an assumption (ADR-0010 decision 3).
      - name: Upload private output
        if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub-private
          path: site/dist-private
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    permissions:
      pages: write # to create the Pages deployment
      id-token: write # deploy-pages verifies the deployment's origin with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke-test:
    needs: deploy
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    permissions: {}
    steps:
      - name: Wait for Pages propagation
        run: sleep 30

      - name: Smoke test live routes
        run: |
          SITE="https://djjay0131.github.io/website"
          FAILED=0
          for ROUTE in "/" "/resumes/" "/cv/academic" "/cv/research-professional" "/papers/" "/pdfs/academic.pdf" "/projects/"; do
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "${SITE}${ROUTE}")
            if [ "$STATUS" = "200" ]; then
              echo "OK: ${ROUTE} → ${STATUS}"
            else
              echo "FAIL: ${ROUTE} → ${STATUS}"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more smoke tests failed."
            exit 1
          fi

      - name: Verify non-empty body on key routes
        run: |
          SITE="https://djjay0131.github.io/website"
          for ROUTE in "/cv/academic" "/papers/"; do
            BODY_SIZE=$(curl -sL "${SITE}${ROUTE}" | wc -c)
            if [ "$BODY_SIZE" -lt 500 ]; then
              echo "::error::${ROUTE} returned suspiciously small body (${BODY_SIZE} bytes)"
              exit 1
            fi
            echo "OK: ${ROUTE} body is ${BODY_SIZE} bytes"
          done

  # Firebase Hosting deploy (SEAM-3, SEAM-4). Runs only on the deploy path and
  # only after the owner sets vars.GCP_PROJECT_ID. Authentication is Workload
  # Identity Federation: GitHub's OIDC token is exchanged for a short-lived
  # credential that impersonates the deploy service account. No key file, no
  # token secret. The WIF binding admits only refs/heads/main (infra/deploy.tf).
  firebase-deploy:
    needs: build-firebase
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    permissions:
      contents: read # checkout, for firebase.json
      id-token: write # the GitHub OIDC token exchanged through WIF
    steps:
      - name: Check deploy configuration
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          MISSING=0
          for NAME in GCP_WIF_PROVIDER GCP_DEPLOY_SA; do
            if [ -z "${!NAME}" ]; then
              echo "::error::GCP_PROJECT_ID is set but the GitHub Actions variable ${NAME} is not (see infra/README.md)."
              MISSING=1
            fi
          done
          exit "${MISSING}"

      # Checkout comes before auth: auth writes its credentials file into the
      # workspace, and a later checkout would delete it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download Firebase Hosting build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firebase-hosting
          path: site/dist-public

      # Exact Node version. Node 22.23.0 shipped an http.Agent keep-alive
      # regression that breaks google-auth-library's STS token exchange and so
      # WIF deploys (firebase/firebase-tools#10716, nodejs/node#63989; fixed in
      # 22.23.1). An exact pin avoids it without floating the deploy runtime:
      # the version changes only by a reviewed commit. (The build jobs keep
      # node-version: 22; the token they hold reads one bucket and cannot write.)
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.1

      # firebase-tools and its whole dependency tree come from the committed
      # lockfile (infra/deploy-tools), installed before any credential exists in
      # this job. Bump through a reviewed lockfile change.
      - name: Install firebase-tools from the lockfile
        run: npm ci --prefix infra/deploy-tools --no-audit --no-fund

      # Writes an external_account credentials file (service account
      # impersonation) and exports GOOGLE_APPLICATION_CREDENTIALS, which
      # firebase-tools reads through google-auth-library's GoogleAuth
      # (firebase-tools src/requireAuth.ts, autoAuth).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # The locked firebase-tools (15.30.1, infra/deploy-tools/package-lock.json).
      - name: Deploy to Firebase Hosting
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          infra/deploy-tools/node_modules/.bin/firebase deploy \
            --only hosting \
            --project "${GCP_PROJECT_ID}" \
            --non-interactive \
            --message "${GITHUB_SHA} (run ${GITHUB_RUN_ID})"

  # THE DESTRUCTIVE PRIVATE SYNC (ADR-0010 decision 5; SEAM-5).
  #
  # Pushes site/dist-private to the private bucket and DELETES objects the
  # current build did not produce, so a withdrawn private item stops being
  # READABLE rather than merely stopping being linked. dist-public gets that for
  # free because it is redeployed wholesale; the private side is a sync, and a
  # sync that only adds leaves a withdrawn dossier served at its old path to
  # every member.
  #
  # THIS IS THE ONE JOB IN THIS WORKFLOW THAT CAN DESTROY DATA. Four things gate
  # it, and they are deliberately layered so no single mistake is sufficient:
  #
  #   1. `needs: build-firebase` — it cannot start unless the content synced,
  #      every manifest validated, the expected-source check passed, BOTH builds
  #      succeeded and the leak check passed. That is ADR-0010 decision 3 at the
  #      workflow level.
  #   2. The build receipt inside the artifact — scripts/sync-private.mjs refuses
  #      to delete anything without it, and it is written only at the very end of
  #      a successful private build. That is the same gate at the script level,
  #      and it survives someone re-ordering these steps.
  #   3. The deploy path only. Never on a pull request, and only once the owner
  #      has set both variables.
  #   4. A deletion ceiling inside the script: a sync that would remove most of
  #      the destination stops and asks for a human.
  #
  # It deliberately does NOT depend on firebase-deploy: the public host and the
  # private bucket are separate targets, and a Hosting failure is no reason to
  # leave withdrawn private content readable.
  private-sync:
    needs: build-firebase
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'pull_request'
      && vars.GCP_PROJECT_ID != ''
      && vars.GCP_PRIVATE_BUCKET != ''
    permissions:
      contents: read # checkout, for site/scripts/sync-private.mjs
      id-token: write # the GitHub OIDC token exchanged through WIF
    steps:
      # Checkout comes before auth: auth writes its credentials file into the
      # workspace, and a later checkout would delete it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # include-hidden-files was set on the upload so .hub-private-build.json
      # travels. Without the receipt this job refuses to run at all, which is the
      # intended behaviour rather than a hazard.
      - name: Download the private output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hub-private
          path: site/dist-private

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      # Always printed, so every deletion this run intends is in the log BEFORE
      # anything is removed, whether or not the apply step then succeeds.
      - name: Plan the private sync (dry run)
        working-directory: site
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PRIVATE_BUCKET: ${{ vars.GCP_PRIVATE_BUCKET }}
        run: node scripts/sync-private.mjs --bucket "${PRIVATE_BUCKET}"

      - name: Sync the private output, pruning what this build did not produce
        working-directory: site
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PRIVATE_BUCKET: ${{ vars.GCP_PRIVATE_BUCKET }}
        run: node scripts/sync-private.mjs --bucket "${PRIVATE_BUCKET}" --apply

  # Same routes and body-size checks as the Pages smoke test, against the
  # Firebase host at base path "/".
  firebase-smoke-test:
    needs: firebase-deploy
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    permissions: {}
    steps:
      - name: Resolve the Firebase site URL
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          SITE="${SITE_URL:-https://${GCP_PROJECT_ID}.web.app}"
          echo "SITE=${SITE%/}" >> "$GITHUB_ENV"
          echo "Smoke testing ${SITE%/}"

      - name: Wait for Hosting propagation
        run: sleep 15

      - name: Smoke test live routes
        run: |
          FAILED=0
          for ROUTE in "/" "/resumes/" "/cv/academic" "/cv/research-professional" "/papers/" "/pdfs/academic.pdf" "/projects/"; do
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "${SITE}${ROUTE}")
            if [ "$STATUS" = "200" ]; then
              echo "OK: ${ROUTE} → ${STATUS}"
            else
              echo "FAIL: ${ROUTE} → ${STATUS}"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more Firebase smoke tests failed."
            exit 1
          fi

      - name: Verify non-empty body on key routes
        run: |
          for ROUTE in "/cv/academic" "/papers/"; do
            BODY_SIZE=$(curl -sL "${SITE}${ROUTE}" | wc -c)
            if [ "$BODY_SIZE" -lt 500 ]; then
              echo "::error::${ROUTE} returned suspiciously small body (${BODY_SIZE} bytes)"
              exit 1
            fi
            echo "OK: ${ROUTE} body is ${BODY_SIZE} bytes"
          done

  # Single place that reports failures anywhere in the pipeline. The webhook is
  # optional; the tracking issue is not, so a broken build is visible (and
  # emailed by GitHub) even with no secrets configured at all. Without this,
  # nothing surfaced ~190 consecutive scheduled failures over 8 days.
  notify-failure:
    needs: [check, budget-guard, build, deploy, smoke-test, build-firebase, firebase-deploy, firebase-smoke-test, private-sync]
    runs-on: ubuntu-24.04
    # A failed PR check already shows up on the PR itself; only page out for
    # failures on the real deploy path.
    if: failure() && github.event_name != 'pull_request'
    permissions:
      issues: write # label, list, comment on and open the tracking issue
    steps:
      - name: Send webhook notification
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK }}
        run: |
          if [ -n "${WEBHOOK_URL}" ]; then
            curl -sSf -X POST "${WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"Website build/deploy failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          else
            echo "No NOTIFICATION_WEBHOOK configured; relying on the tracking issue."
          fi

      - name: Open or update the failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create ci-failure \
            --color B60205 \
            --description "Automated build/deploy failure" \
            --force >/dev/null

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EXISTING=$(gh issue list --label ci-failure --state open --limit 1 \
            --json number --jq '.[0].number // ""')

          # One issue per outage, not one per hourly run -- comment on the open
          # one instead of filing a new one every hour.
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" \
              --body "Still failing as of ${GITHUB_EVENT_NAME} run: ${RUN_URL}"
            echo "Commented on existing issue #${EXISTING}."
          else
            gh issue create \
              --title "build-and-deploy is failing" \
              --label ci-failure \
              --body "$(printf '%s\n' \
                "The \`build-and-deploy\` workflow failed." \
                "" \
                "- Run: ${RUN_URL}" \
                "- Trigger: ${GITHUB_EVENT_NAME}" \
                "- Commit: ${GITHUB_SHA}" \
                "" \
                "This issue is opened automatically and closes on the next fully successful run.")"
          fi

  # Closes the tracking issue once the pipeline is healthy again. It needs a
  # successful Pages smoke test (so no-op scheduled runs, where build is
  # skipped, do not count) and no failed job anywhere. The Firebase jobs may be
  # skipped -- they are until the owner configures them -- but not failed.
  notify-recovery:
    needs: [check, budget-guard, build, deploy, smoke-test, build-firebase, firebase-deploy, firebase-smoke-test, private-sync]
    runs-on: ubuntu-24.04
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.smoke-test.result == 'success'
      && !contains(needs.*.result, 'failure')
    permissions:
      issues: write # list and close the tracking issue
    steps:
      - name: Close the failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for N in $(gh issue list --label ci-failure --state open --json number --jq '.[].number'); do
            gh issue close "${N}" --comment "Recovered: ${RUN_URL}"
            echo "Closed #${N}."
          done
