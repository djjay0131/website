name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [cv-updated]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write   # failure notifications fall back to opening an issue.

# Real deploys (push/schedule/dispatch) stay serialized under a single "pages"
# group so they never race each other. PR validation builds get their own
# per-branch group -- they never deploy, so they must not queue behind (or hold
# up) the deploy lane, and a new push to a PR supersedes the run in flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This site has no CV content of its own -- it pulls it from the cv repo's
  # "latest" release at build time. The hourly schedule exists to notice new
  # releases, but almost every poll finds nothing new and rebuilds identical
  # bytes. Fingerprint the release assets and compare against the fingerprint
  # recorded in the currently deployed build; skip the pipeline when they match.
  #
  # Only scheduled polls are eligible to skip. Pushes, PRs, cv-updated
  # dispatches, and manual runs always build -- they imply the inputs or the
  # site code changed, which the fingerprint alone would not catch.
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      fingerprint: ${{ steps.compare.outputs.fingerprint }}
    steps:
      - name: Compare cv release against the deployed build
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          FP=$(gh release view latest --repo djjay0131/cv --json assets \
            --jq '[.assets[] | "\(.name):\(.updatedAt)"] | sort | join(",")')
          echo "fingerprint=${FP}" >> "$GITHUB_OUTPUT"
          echo "cv release fingerprint: ${FP}"

          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "${EVENT_NAME} run -- building unconditionally."
            exit 0
          fi

          # A missing or unreadable build-info.json (first run after this
          # lands, or a failed deploy) falls through to "changed" and builds.
          DEPLOYED=$(curl -sfL "https://djjay0131.github.io/website/build-info.json" \
            | jq -r '.cv_fingerprint // ""' 2>/dev/null || true)
          echo "deployed fingerprint: ${DEPLOYED:-<none>}"

          if [ -n "${DEPLOYED}" ] && [ "${DEPLOYED}" = "${FP}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::cv release unchanged since the deployed build; skipping build and deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Fetch CV data and PDF
        env:
          GH_TOKEN: ${{ github.token }}
          CV_FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
        run: |
          mkdir -p data/content data/variants public/pdfs
          gh release download latest --repo djjay0131/cv --pattern "cv-data.zip" --dir /tmp/cv-fetch --clobber
          # Pull every variant PDF in the release (one per data/variants/<name>.yaml).
          gh release download latest --repo djjay0131/cv --pattern "*.pdf" --dir public/pdfs --clobber
          unzip -o /tmp/cv-fetch/cv-data.zip -d /tmp/cv-fetch/extracted
          cp -r /tmp/cv-fetch/extracted/data/* data/ 2>/dev/null || true
          cp /tmp/cv-fetch/extracted/own-bib.bib data/ 2>/dev/null || true
          cp /tmp/cv-fetch/extracted/photo_jason_1.jpeg public/ 2>/dev/null || true
          rm -rf /tmp/cv-fetch

          # Astro copies public/ verbatim into dist/, so this ships to
          # <site>/build-info.json and becomes the state the next scheduled
          # poll compares against. jq handles the quoting.
          jq -n \
            --arg fp "${CV_FINGERPRINT}" \
            --arg sha "${GITHUB_SHA}" \
            --arg run "${GITHUB_RUN_ID}" \
            '{cv_fingerprint: $fp, built_from_sha: $sha, run_id: $run}' \
            > public/build-info.json
          cat public/build-info.json

      - name: Run tests
        run: npm test

      - name: Build Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - name: Wait for Pages propagation
        run: sleep 30

      - name: Smoke test live routes
        run: |
          SITE="https://djjay0131.github.io/website"
          FAILED=0
          for ROUTE in "/" "/resumes/" "/cv/academic" "/cv/research-professional" "/papers/" "/pdfs/academic.pdf" "/projects/"; do
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "${SITE}${ROUTE}")
            if [ "$STATUS" = "200" ]; then
              echo "OK: ${ROUTE} → ${STATUS}"
            else
              echo "FAIL: ${ROUTE} → ${STATUS}"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more smoke tests failed."
            exit 1
          fi

      - name: Verify non-empty body on key routes
        run: |
          SITE="https://djjay0131.github.io/website"
          for ROUTE in "/cv/academic" "/papers/"; do
            BODY_SIZE=$(curl -sL "${SITE}${ROUTE}" | wc -c)
            if [ "$BODY_SIZE" -lt 500 ]; then
              echo "::error::${ROUTE} returned suspiciously small body (${BODY_SIZE} bytes)"
              exit 1
            fi
            echo "OK: ${ROUTE} body is ${BODY_SIZE} bytes"
          done

  # Single place that reports failures anywhere in the pipeline. The webhook is
  # optional; the tracking issue is not, so a broken build is visible (and
  # emailed by GitHub) even with no secrets configured at all. Without this,
  # nothing surfaced ~190 consecutive scheduled failures over 8 days.
  notify-failure:
    needs: [check, build, deploy, smoke-test]
    runs-on: ubuntu-24.04
    # A failed PR check already shows up on the PR itself; only page out for
    # failures on the real deploy path.
    if: failure() && github.event_name != 'pull_request'
    steps:
      - name: Send webhook notification
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK }}
        run: |
          if [ -n "${WEBHOOK_URL}" ]; then
            curl -sSf -X POST "${WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"Website build/deploy failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          else
            echo "No NOTIFICATION_WEBHOOK configured; relying on the tracking issue."
          fi

      - name: Open or update the failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ci-failure \
            --color B60205 \
            --description "Automated build/deploy failure" \
            --force >/dev/null

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EXISTING=$(gh issue list --label ci-failure --state open --limit 1 \
            --json number --jq '.[0].number // ""')

          # One issue per outage, not one per hourly run -- comment on the open
          # one instead of filing a new one every hour.
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" \
              --body "Still failing as of ${GITHUB_EVENT_NAME} run: ${RUN_URL}"
            echo "Commented on existing issue #${EXISTING}."
          else
            gh issue create \
              --title "build-and-deploy is failing" \
              --label ci-failure \
              --body "$(printf '%s\n' \
                "The \`build-and-deploy\` workflow failed." \
                "" \
                "- Run: ${RUN_URL}" \
                "- Trigger: ${GITHUB_EVENT_NAME}" \
                "- Commit: ${GITHUB_SHA}" \
                "" \
                "This issue is opened automatically and closes on the next fully successful run.")"
          fi

  # Closes the tracking issue once the pipeline is healthy again. Skipped
  # automatically on no-op scheduled runs, since its needs are skipped too.
  notify-recovery:
    needs: [check, build, deploy, smoke-test]
    runs-on: ubuntu-24.04
    if: success() && github.event_name != 'pull_request'
    steps:
      - name: Close the failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for N in $(gh issue list --label ci-failure --state open --json number --jq '.[].number'); do
            gh issue close "${N}" --comment "Recovered: ${RUN_URL}"
            echo "Closed #${N}."
          done
