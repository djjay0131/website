name: d25-visual

# D25 visual verification. Synthetic content only: pull-request runs cannot
# authenticate to the private content bucket (the WIF binding admits main), and
# real private pages must never be committed or attached from a public repo.
# The check exercises the same rendered templates and the same access join.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Publish fixture content
        run: npm run content:fixture

      - name: Build the public 404 shell
        run: npm run build

      - name: Generate the styled 404 shell
        run: npm run redirects:stubs

      - name: Create synthetic D25 projects and principals
        run: node scripts/d25-visual-fixtures.mjs /tmp/d25-visual

      - name: Build the private output with the synthetic projects
        env:
          # The repository links are real on a normal build; synthetic here so
          # neither a private repository name nor the real mapping is captured
          # in a public PR screenshot artifact.
          HUB_SATELLITE_REPOS: '{"visual-study":"example/visual-study","visual-other":"example/visual-other","phd-milestones":"example/phd-milestones","ebay-erupt":"example/ebay-erupt","visual-saner":"example/visual-saner"}'
        run: npm run build:private

      - name: Render and assert each D25 principal
        env:
          D25_PRINCIPALS: /tmp/d25-visual/principals.json
          D25_POLICY: /tmp/d25-visual/policy.json
          D25_SCREENSHOTS: /tmp/d25-screenshots
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
        run: node scripts/d25-visual-check.mjs

      - name: Render and assert each D26 principal (calendar and repository)
        env:
          D25_PRINCIPALS: /tmp/d25-visual/principals.json
          D25_POLICY: /tmp/d25-visual/policy.json
          D26_SCREENSHOTS: /tmp/d26-screenshots
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
        run: node scripts/d26-visual-check.mjs

      - name: D28 eBay pulled source, principals and project
        env:
          D25_PRINCIPALS: /tmp/d25-visual/principals.json
          D25_POLICY: /tmp/d25-visual/policy.json
          D28_SCREENSHOTS: /tmp/d28-screenshots
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
        run: node scripts/d28-visual-check.mjs

      - name: D27 note composer, before/after
        env:
          D25_PRINCIPALS: /tmp/d25-visual/principals.json
          D25_POLICY: /tmp/d25-visual/policy.json
          D27_SCREENSHOTS: /tmp/d27-screenshots
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
        run: node scripts/d27-notes-check.mjs

      - name: D29 private PDF viewer and download
        env:
          D25_PRINCIPALS: /tmp/d25-visual/principals.json
          D25_POLICY: /tmp/d25-visual/policy.json
          D29_SCREENSHOTS: /tmp/d29-screenshots
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
        run: node scripts/d29-visual-check.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d25-d28-screenshots
          path: |
            /tmp/d25-screenshots
            /tmp/d26-screenshots
            /tmp/d27-screenshots
            /tmp/d28-screenshots
            /tmp/d29-screenshots
          if-no-files-found: warn

