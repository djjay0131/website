<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Jason Cusati — research emblem</title>
  <desc id="d">A round maroon-and-orange badge: mountains and a sunrise behind a campus tower, an open laptop over an open book, and the words Research today, a brighter tomorrow.</desc>
  <defs>
    <clipPath id="disc"><circle cx="200" cy="200" r="176"/></clipPath>
    <path id="arcTop" d="M 60 200 A 140 140 0 0 1 340 200"/>
    <path id="arcBot" d="M 340 200 A 140 140 0 0 1 60 200"/>
  </defs>

  <!-- outer rings -->
  <circle cx="200" cy="200" r="196" fill="#861f41"/>
  <circle cx="200" cy="200" r="188" fill="#e5751f"/>
  <circle cx="200" cy="200" r="182" fill="#861f41"/>
  <circle cx="200" cy="200" r="176" fill="#fbfbf8"/>

  <g clip-path="url(#disc)">
    <!-- sunrise -->
    <circle cx="200" cy="190" r="60" fill="#e5751f"/>
    <!-- far mountains -->
    <path d="M 20 215 L 90 150 L 130 185 L 175 130 L 215 175 L 260 128 L 310 182 L 345 152 L 380 215 Z" fill="#c64600" opacity="0.55"/>
    <!-- near mountains -->
    <path d="M 10 235 L 70 178 L 115 210 L 160 160 L 205 205 L 245 168 L 300 218 L 350 185 L 390 235 Z" fill="#861f41"/>
    <!-- tower -->
    <g fill="#5f162e">
      <rect x="248" y="150" width="30" height="90"/>
      <rect x="244" y="144" width="38" height="8"/>
      <rect x="252" y="128" width="22" height="18"/>
      <rect x="258" y="118" width="10" height="12"/>
      <rect x="230" y="200" width="66" height="40"/>
    </g>
    <g fill="#e5751f">
      <rect x="256" y="160" width="5" height="9"/><rect x="266" y="160" width="5" height="9"/>
      <rect x="256" y="178" width="5" height="9"/><rect x="266" y="178" width="5" height="9"/>
    </g>
    <!-- ground band -->
    <rect x="0" y="235" width="400" height="140" fill="#5f162e"/>
    <!-- open book -->
    <path d="M 95 292 Q 150 274 200 288 Q 250 274 305 292 L 305 310 Q 250 294 200 308 Q 150 294 95 310 Z" fill="#fbfbf8"/>
    <path d="M 200 288 L 200 308" stroke="#861f41" stroke-width="3"/>
    <g stroke="#c3c6bc" stroke-width="2" fill="none">
      <path d="M 112 295 Q 150 284 190 294"/><path d="M 112 303 Q 150 292 190 302"/>
      <path d="M 210 294 Q 250 284 288 295"/><path d="M 210 302 Q 250 292 288 303"/>
    </g>
    <!-- laptop -->
    <rect x="140" y="224" width="120" height="66" rx="5" fill="#14181b"/>
    <rect x="147" y="231" width="106" height="52" rx="2" fill="#861f41"/>
    <text x="200" y="266" text-anchor="middle" font-family="Spectral, Georgia, serif" font-weight="600" font-size="26" fill="#fbfbf8">JC</text>
    <path d="M 120 290 L 280 290 L 272 298 L 128 298 Z" fill="#3c4448"/>
  </g>

  <!-- arc text -->
  <text font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.2" fill="#861f41">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">RESEARCH TODAY  ·  A BRIGHTER TOMORROW</textPath>
  </text>
  <text x="200" y="346" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" letter-spacing="2.6" fill="#fbfbf8">EXPLORE  ·  ANALYZE  ·  IMPACT</text>
  <path d="M 150 331 L 250 331" stroke="#e5751f" stroke-width="2"/>
</svg>
