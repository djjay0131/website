[project]
name = "hub-gate"
version = "0.1.0"
description = "Sessions, the member allowlist, and serving /p/** for the research hub (design doc §6, responsibilities 1-3)."
requires-python = "==3.12.*"

# Exact pins only. requirements.txt (runtime) and requirements-dev.txt (runtime
# plus test tooling) are compiled from these with hashes, and the image installs
# from requirements.txt with --require-hashes, so nothing enters the container
# that is not named and checksummed in this repository.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "firebase-admin==7.5.0",
  "google-cloud-storage==3.14.1",
  "google-cloud-firestore==2.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.16.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # import order
  "B",    # bugbear
  "UP",   # pyupgrade
  "S",    # flake8-bandit: this is a security-critical service
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",
]
ignore = [
  # Binding 0.0.0.0 is how Cloud Run requires a container to listen.
  "S104",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and deliberately carry hostile string literals.
"tests/*" = ["S101", "S105", "S106", "SLF001"]
